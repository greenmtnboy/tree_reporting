<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved/system preference before the app or stylesheet paints.
      (() => {
        let theme = 'system'
        // Falls back to arborary.world's toggle (same origin when served at
        // /explore/); keep in step with storedPreference in useTheme.ts.
        try { theme = localStorage.getItem('urban-trees-theme') || localStorage.getItem('vitepress-theme-appearance') || 'system' } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>Tree Explorer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
