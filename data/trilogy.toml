[project]
name = "urban_forest"

[engine]
# Default dialect for execution
dialect = "duck_db"
parallelism = 3
env_file="../.env"

[engine.config]
enable_gcs = true
enable_spatial = true
enable_python_datasources = true
gcs_cache_bust = true

[serve]
studio_url="http://localhost:5173/trilogy-studio-core/"

# How this directory is deployed to trilogy-cloud by `trilogy cloud sync` (see
# .github/workflows/cloud-sync.yml). `name` is display-only; the job's identity
# is the repository plus this directory's path under the sync root, so the
# rename keeps the same job id and schedule binding.
#
# Only main syncs, into production. There is no per-branch dev deploy flow yet.
[cloud]
org = "trilogy-data"
name = "urban-tree-data"
operation = "refresh"
# Three ticks, none of them in a portal's published maintenance window:
# municipal portals 503 intermittently (Buenos Aires especially) or go down for
# maintenance, and a tick that finds nothing stale exits up_to_date in a few
# minutes, so extra attempts are close to free.
#
# The morning tick moved off 06:00 UTC (inherited from the retired GitHub
# Actions cron) because Berlin publishes a *weekly* window — "Regelmäßiges
# Wartungsfenster: Donnerstags von 8:00 bis 10:00 Uhr"
# (berlin.de/sen/stadt/stadtdaten/geodaten-berlin/geoportal-daten-und-dienste/).
# That is 06:00-08:00 UTC in CEST and 07:00-09:00 UTC in CET, so 06:00 UTC sat
# inside it every Thursday of the summer. 04:00 / 12:00 / 20:00 clear the whole
# 06:00-09:00 UTC band year-round.
#
# One job for the whole directory, deliberately. pytrilogy >=0.3.328 can declare
# several jobs over one tree as a `[[cloud.job]]` array — a natural fit for
# giving an outage-prone city (Berlin) its own cheap catch-up ticks, or for
# splitting trees / landmarks / enrichment into lanes that cannot eat each
# other's timeout. It is all-or-nothing: once one entry exists this block is
# defaults only, every job must name its own `entrypoint`, and identity moves
# from the path to `path::key`, so a `--prune` sync replaces this job rather
# than editing it. Not worth that churn while the probes degrade instead of
# aborting (data/raw/_ingest_shared.py::emit_freshness) and three daily ticks
# already give every city three chances.
schedule = "0 0 4,12,20 * * *"
# A fully stale rebuild downloads every municipal dataset (~50MB each across
# fourteen cities); the common case is a couple of stale cities or a clean
# "already fresh" exit.
timeout_seconds = 3600
# The default 1 GiB container was killed by the OOM reaper part-way through a
# full rebuild:
#
#   Out of memory: the kernel killed the job (SIGKILL) because the container
#   exceeded its memory limit -- peak 1024.0 MiB against a 1.00 GiB limit
#
# It died on Berlin, which is the high-water mark: 330,178 staged OSM rows
# stacked against a 434,765-row municipal inventory, with the dedup grid
# aggregate running over the union. Three cities had completed first, all small.
#
# Oversized Python ingests were a real and separate problem -- Amsterdam alone
# held 882 MiB of dicts before it was streamed -- but fixing those only moved
# the failure, because the remaining pressure is DuckDB's own aggregate memory
# and no amount of Python-side streaming touches that.
#
# 4 GiB against a measured 1 GiB peak, and `parallelism = 3` means up to three
# asset builds share it, so this is ~1.3 GiB each rather than 4. Worth revisiting
# once a full-rebuild run reports its own peak: the first run after an OSM-style
# schema change rebuilds all fourteen cities, while an ordinary tick rebuilds
# the one or two that went stale.
memory_mb = 4096
# DuckDB writes the parquets to gcs:// itself; these org secrets are the only
# credentials that work for that bucket.
secret_env = ["GOOGLE_HMAC_KEY", "GOOGLE_HMAC_SECRET"]