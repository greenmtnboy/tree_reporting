[project]
name = "urban_forest"

[engine]
# Default dialect for execution
dialect = "duck_db"
parallelism = 3
env_file="../.env"

[engine.config]
enable_gcs = true
enable_spatial = true
enable_python_datasources = true
gcs_cache_bust = true

[serve]
studio_url="http://localhost:5173/trilogy-studio-core/"

# How this directory is deployed to trilogy-cloud by `trilogy cloud sync` (see
# .github/workflows/cloud-sync.yml). Only main syncs, into production — the
# target environment is derived from the current git branch, so a sync run
# from a feature-branch checkout lands in a branch-scoped environment, NOT
# production. Two footguns found the hard way: passing `--environment
# production` from a branch checkout does not update the production jobs, it
# creates a parallel workspace and a duplicate job set with live schedules;
# and `env delete` without `--with-jobs` orphans the environment's jobs into
# production rather than removing them. Tear a branch environment down with
# `trilogy cloud env delete <name> --with-jobs`.
#
# This block holds what every job shares (the org, the workspace, the GCS
# secrets); each [[cloud.job]] below says only what makes it different. The
# array form is all-or-nothing — every entry must name its own key, name and
# entrypoint, and identity is `path::key` rather than the bare path — which is
# why the first sync after this conversion REPLACES the old single
# path-identified job (`--prune` removes it) instead of editing it: run
# history resets once, schedules rebind to the new identities. That cost was
# deferred while one job sufficed; it stopped sufficing when OSM extraction
# needed its own cadence.
#
# DuckDB writes the parquets to gcs:// itself; these org secrets are the only
# credentials that work for that bucket, and they serve the extract jobs'
# staging writes exactly as they serve the refresh job's.
[cloud]
org = "trilogy-data"
workspace = "urban-tree-data"
secret_env = ["GOOGLE_HMAC_KEY", "GOOGLE_HMAC_SECRET"]

# --- The main refresh, split into lanes ------------------------------------
#
# The platform requires a job's entrypoint to be a *file* in the workspace
# (a directory like `raw` is rejected), and a single umbrella file importing
# every model does not work: merged bare the models collide (tree latitude vs
# landmark latitude), and namespaced imports leak their prefix into
# materialised parquet column names (verified — full_tree_info came out with
# `enrichment_latitude`). So the refresh is four jobs, one per lane, each
# materialising its own disjoint asset set with bare column names — the
# trees/landmarks/enrichment lane split this file previously mused about,
# forced by the entrypoint rule.
#
# The trees lane's entrypoint is raw/tree_cities.preql — the city models
# with no cross-city merge — NOT raw/tree_info.preql. This is load-bearing:
# planned inside tree_info.preql's environment, the `data_source` merge and
# the full rollup datasource break per-city resolution, and a city's parquet
# materialises FROM full_tree_info_v2.parquet — the rollup built from the
# city parquets. Athens's first cloud build went exactly that way: an
# OSM-staging-only parquet (zero municipal rows) with its watermark advanced
# so nothing ever looked stale, rebuilt identically on every forced retry.
# The old single job dodged this because directory execution plans each
# preql file in its own environment; a file entrypoint holding the merge
# does not. See the header of raw/tree_cities.preql.
#
# full_tree_info is NOT built by the trees lane as a result — the enrichment
# lane builds it: tree_enrichment.preql imports tree_info, so its refresh
# picks up the stale rollup an hour after the cities land and builds it from
# their parquets (verified: the rollup plans identically through either
# file's environment). The residual hazard of that environment is the same
# circular plan — a city that goes stale between the trees tick and the
# enrichment tick is "rebuilt" from the rollup, recycling its rows and
# advancing its watermark, freezing that city's content until its portal
# publishes again and the trees lane picks it up. That window is an hour,
# needs a portal to publish inside it, and self-heals; a trees-lane failure
# widens it, so treat a red trees run as urgent rather than waiting a tick.
#
# The osm_staging/ and landmark_staging/ models stay out of every lane's
# reach (no imports either direction) or their ever-advancing watermarks
# would re-extract/republish on every tick.
#
# Three ticks, none in a portal's published maintenance window: municipal
# portals 503 intermittently (Buenos Aires especially), and a tick that finds
# nothing stale exits up_to_date in minutes, so extra attempts are close to
# free. The ticks avoid 06:00-09:00 UTC because Berlin publishes a weekly
# window — "Donnerstags von 8:00 bis 10:00 Uhr" — which is 06:00-08:00 UTC in
# CEST and 07:00-09:00 UTC in CET.
#
# trees lane memory: the default 1 GiB container was OOM-killed part-way
# through a full rebuild — it died on Berlin, the high-water mark: 330,178
# staged OSM rows stacked against a 434,765-row municipal inventory with the
# dedup grid aggregate running over the union. 4 GiB against a measured 1 GiB
# peak, and `parallelism = 3` means up to three asset builds share it.
#
# enrichment lane: tree_enrichment.preql imports tree_info, so this lane can
# reach the city parquets as dependencies. Its ticks are offset an hour after
# the trees lane so the cities are already fresh and it no-ops on them —
# never two jobs building the same parquet concurrently. Isolating it also
# means the slow LLM enrichment runs can no longer eat the trees lane's
# timeout.
[[cloud.job]]
key = "refresh"
name = "urban-tree-data"
entrypoint = "raw/tree_cities.preql"
operation = "refresh"
schedule = "0 0 4,12,20 * * *"
timeout_seconds = 3600
memory_mb = 4096

[[cloud.job]]
key = "refresh-landmarks"
name = "urban-tree-data-landmarks"
entrypoint = "raw/landmark_info.preql"
operation = "refresh"
schedule = "0 0 4,12,20 * * *"
timeout_seconds = 1800
memory_mb = 2048

[[cloud.job]]
key = "refresh-ecoregions"
name = "urban-tree-data-ecoregions"
entrypoint = "raw/ecoregion_info.preql"
operation = "refresh"
schedule = "0 0 4,12,20 * * *"
timeout_seconds = 900
memory_mb = 1024

[[cloud.job]]
key = "refresh-enrichment"
name = "urban-tree-data-enrichment"
entrypoint = "raw/tree_enrichment.preql"
operation = "refresh"
schedule = "0 0 5,13,21 * * *"
timeout_seconds = 3600
memory_mb = 2048

# --- Scheduled OSM extraction, one job per city ----------------------------
#
# Each job refreshes one osm_staging/{code}_osm_staging.preql, which fetches
# the city's Overpass trees and materialises the staging parquet the city's
# tree model reads — the cloud-credentialed replacement for running
# raw/{city}/{city}_osm_extract.py by hand. Per-city jobs so each city gets
# its own cadence; add a city by copying an osm_staging/ pair and one entry
# here (see EXTENDING.md).
#
# Schedules are STAGGERED, never concurrent: Overpass allows two slots per
# client IP and answers an over-budget request with HTTP 200 carrying an
# error remark, so two extract jobs firing together can fail each other on a
# transient. Keep new entries off other jobs' minutes and off the refresh
# ticks (the extract must land before a refresh tick can pick it up, but any
# gap works — the next of three daily ticks always comes).
#
# Weekly is the deliberate default cadence: OSM tree edits trickle, and every
# extract firing re-publishes the staging object, which marks the city stale
# and rebuilds its full municipal union on the next refresh tick — a cheap
# extract buys a not-cheap rebuild, so the schedule below is the knob that
# prices it.
[[cloud.job]]
key = "osm-grath"
name = "urban-tree-osm-grath"
entrypoint = "osm_staging/grath_osm_staging.preql"
operation = "refresh"
schedule = "0 0 2 * * 1"    # Mondays 02:00 UTC
timeout_seconds = 1800
memory_mb = 1024

[[cloud.job]]
key = "osm-grmlo"
name = "urban-tree-osm-grmlo"
entrypoint = "osm_staging/grmlo_osm_staging.preql"
operation = "refresh"
schedule = "0 30 2 * * 1"   # Mondays 02:30 UTC — staggered off osm-grath
timeout_seconds = 1800
memory_mb = 1024

# --- Ad-hoc landmark staging publish, one job per city ---------------------
#
# NO schedule, deliberately: these fire only by hand
# (`trilogy cloud jobs run urban-tree-landmarks-{code} --wait`). Each one
# republishes a committed, Nominatim-geocoded landmark CSV as the staging
# parquet its city's landmark model reads — the whole workspace tree syncs on
# merge, CSVs included, so this is how a CSV edit reaches GCS without any
# local Google credential.
#
# `operation = "run"` with a `copy into parquet` script, not `refresh`: a
# refresh target needs a freshness watermark to ever rebuild once its object
# exists, and the only honest watermark for "republish when a person fires
# the job" is the firing itself — which is what `run` says natively. Every
# execution copies, unconditionally; that is also why these must never gain
# a frequent cron, since republishing an unchanged CSV still moves the
# staging object's Last-Modified and the city's landmark parquet would
# rebuild for nothing.
[[cloud.job]]
key = "landmarks-grath"
name = "urban-tree-landmarks-grath"
entrypoint = "landmark_staging/grath_landmarks_staging.preql"
operation = "run"
timeout_seconds = 600
memory_mb = 1024

[[cloud.job]]
key = "landmarks-grmlo"
name = "urban-tree-landmarks-grmlo"
entrypoint = "landmark_staging/grmlo_landmarks_staging.preql"
operation = "run"
timeout_seconds = 600
memory_mb = 1024
