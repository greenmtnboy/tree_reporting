key = "osm-fihel"
name = "urban-tree-osm-fihel"
entrypoint = "osm_staging/fihel_osm_staging.preql"
operation = "refresh"
# Overpass allows two slots per client IP and answers an over-budget request
# with HTTP 200 carrying an error remark, so a collision looks like a city with
# no trees in OSM. This minute must be used by no other extract job.
schedule = "0 30 4 * * FRI"
timeout_seconds = 1800
memory_mb = 1024

# ===========================================================================
# Ad-hoc landmark staging publish — one job per curated-CSV city
# ===========================================================================
#
# NO schedule, deliberately: these fire only by hand
# (`trilogy cloud jobs run urban-tree-landmarks-{code} --wait`). Each one
# republishes a committed, Nominatim-geocoded landmark CSV as the staging
# parquet its city's landmark model reads — the whole workspace tree syncs on
# merge, CSVs included, so this is how a CSV edit reaches GCS without any
# local Google credential.
#
# `operation = "run"` with a `copy into parquet` script, not `refresh`: a
# refresh target needs a freshness watermark to ever rebuild once its object
# exists, and the only honest watermark for "republish when a person fires
# the job" is the firing itself — which is what `run` says natively. Every
# execution copies, unconditionally; that is also why these must never gain
# a frequent cron, since republishing an unchanged CSV still moves the
# staging object's Last-Modified and the city's landmark parquet would
# rebuild for nothing.
#
# Only the three Greek cities are on this path. The other curated-CSV cities
# (USBTV, USTEM, USWAS) still read a hand-uploaded CSV from the staging
# prefix, and DEBER/GBLON still stage from a hand-run Overpass fetch —
# converting those is a code-sharing job (their fetch logic has never been
# shared the way `raw/_osm_shared.py` is), not a scheduling one. Listed in
# EXTENDING.md under the landmarks section as the remaining work.
[[cloud.job]]
key = "landmarks-grath"
name = "urban-tree-landmarks-grath"
entrypoint = "landmark_staging/grath_landmarks_staging.preql"
operation = "run"
timeout_seconds = 600
memory_mb = 1024

[[cloud.job]]
key = "landmarks-grmlo"
name = "urban-tree-landmarks-grmlo"
entrypoint = "landmark_staging/grmlo_landmarks_staging.preql"
operation = "run"
timeout_seconds = 600
memory_mb = 1024

[[cloud.job]]
key = "landmarks-grsan"
name = "urban-tree-landmarks-grsan"
entrypoint = "landmark_staging/grsan_landmarks_staging.preql"
operation = "run"
timeout_seconds = 600
memory_mb = 1024
