# Bozeman's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USBZN"
name = "Bozeman"
slug = "bozeman"
center = [-111.0373, 45.6793]
ecoregion = 394
ecoregion_name = "Montana Valley and Foothill grasslands"
usda_zone = 5
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [45.62, 45.74, -111.13, -110.9842]
territory = [[45.6328, 45.7333, -111.1198, -110.9842]]
municipal_sources = ["BOZEMAN_OPENDATA"]
dedup_note = """
Calibrated 2026-11-28 (osm_dedup_validation): 4m flags 93, 1.1% false;
6m adds 12 true for 14 false (12.6% false).
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
BOZEMAN_OPENDATA = "Bozeman Open Data"

[[tree_sources]]
label = "City of Bozeman Forestry Division - Tree Inventory (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://gisweb.bozeman.net/arcgis/rest/services/Public/Forestry_Public_Web_Map/MapServer/2"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USBZN`.
"""

[jobs.osm]
schedule = "0 0 15 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 41 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
