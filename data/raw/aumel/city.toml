# Melbourne's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "AUMEL"
name = "Melbourne"
slug = "melbourne"
center = [144.9631, -37.8136]
ecoregion = 176
ecoregion_name = "Southeast Australia temperate forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "australasia"
bounds = [-38.1, -37.55, 144.55, 145.4]
territory = [[-38.1, -37.57, 144.55, 145.4]]
municipal_sources = ["MELBOURNE_OPENDATA", "PORT_PHILLIP", "YARRA", "GLEN_EIRA", "HOBSONS_BAY", "BRIMBANK", "MANNINGHAM"]
dedup_note = """
47.6% over n=884: a coin flip.
"""
dedup_cell_metres = 10
data_freshness = "model"
data_freshness_comment = "derived in aumel/melbourne_tree_info.preql from its five council inventories"

[labels]
MELBOURNE_OPENDATA = "City of Melbourne"
PORT_PHILLIP = "City of Port Phillip"
YARRA = "City of Yarra"
GLEN_EIRA = "Glen Eira City Council"
HOBSONS_BAY = "Hobsons Bay City Council"
BRIMBANK = "Brimbank City Council"
MANNINGHAM = "Manningham City Council"

