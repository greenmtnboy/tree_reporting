# Fareham's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "GBFAR"
name = "Fareham"
slug = "fareham"
center = [-1.2, 50.855]
ecoregion = 663
ecoregion_name = "English Lowlands beech forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [50.8, 50.9, -1.32, -1.1]
territory = [[50.8, 50.9, -1.32, -1.1]]
municipal_sources = ["FAREHAM_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-21): 4 m flags 184, 1.1% false, 52.1% recall;
6 m triples the false rate for +40.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
FAREHAM_OPENDATA = "Fareham Open Data"

[[tree_sources]]
label = "Fareham Borough Council - Council Trees (Open Government Licence v3.0; contains OS data © Crown copyright and database right)"
url = "https://maps.fareham.gov.uk/server/rest/services/Corporate/Trees/MapServer/1"

[[landmark_sources]]
label = "Historic England - National Heritage List for England (Open Government Licence)"
url = "https://historicengland.org.uk/listing/the-list/"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city GBFAR`.
"""

[jobs.osm]
schedule = "0 30 11 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 12 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
