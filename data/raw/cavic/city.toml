# Victoria's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAVIC"
name = "Victoria"
slug = "victoria"
center = [-123.3656, 48.4284]
ecoregion = 364
ecoregion_name = "Puget lowland forests"
usda_zone = 9
biome = "Temperate Conifer Forests"
realm = "nearctic"
bounds = [48.39, 48.48, -123.42, -123.3]
territory = [[48.39, 48.48, -123.42, -123.3]]
municipal_sources = ["VICTORIA_OPENDATA"]
dedup_note = """
5-10 m band 37.5% over n=64: neighbour-dominated.  4->6 removes 36
duplicates for 12 hidden trees (3.00), 6->8 removes 9 for 10 (0.90).
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
VICTORIA_OPENDATA = "Victoria Open Data"

[[tree_sources]]
label = "City of Victoria Open Data - Tree Species (Parks trees database)"
url = "https://opendata.victoria.ca/datasets/tree-species-parks-trees-database"

[[landmark_sources]]
label = "City of Victoria Open Data - Prominent Heritage Sites (OCP)"
url = "https://opendata.victoria.ca/datasets/prominent-heritage-sites-ocp"

[jobs.city]
schedule = "0 20 19 * * TUE,FRI"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAVIC`.
"""

[jobs.osm]
schedule = "0 0 4 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 38 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
