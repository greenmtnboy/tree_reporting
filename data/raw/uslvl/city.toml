# Loveland's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USLVL"
name = "Loveland"
slug = "loveland"
center = [-105.075, 40.3978]
ecoregion = 402
ecoregion_name = "Western shortgrass prairie"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [40.35, 40.48, -105.29, -104.96]
territory = [[40.35, 40.48, -105.29, -104.96]]
municipal_sources = ["LOVELAND_OPENDATA"]
dedup_note = """
Calibrated 2026-11-28 (osm_dedup_validation): 6m flags 119, 0.8% false;
8m adds 4 true for 4 false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
LOVELAND_OPENDATA = "Loveland Open Data"

[[tree_sources]]
label = "City of Loveland GIS - City of Loveland Trees (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=0f66e47e8c7a4e60804ec871d5827ff1"

[[landmark_sources]]
label = "City of Loveland Development Services - Designated Local Historic Properties (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://services1.arcgis.com/d4MV7N9xmuHYbLrF/arcgis/rest/services/Historic_Properties/FeatureServer/5"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USLVL`.
"""

[jobs.osm]
schedule = "0 0 15 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 43 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
