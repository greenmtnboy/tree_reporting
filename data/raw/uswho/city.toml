# West Hollywood's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USWHO"
name = "West Hollywood"
slug = "west_hollywood"
center = [-118.3617, 34.09]
ecoregion = 422
ecoregion_name = "California coastal sage and chaparral"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "nearctic"
bounds = [34.07, 34.11, -118.4, -118.34]
territory_note = """
West Hollywood's own line (boundaries/uswho.json), an enclave between
Los Angeles and Beverly Hills.  Its inventory was a partition of Los
Angeles's model until 2026-11.
"""
territory = [[34.0763, 34.098, -118.3959, -118.3433]]
municipal_sources = ["WEST_HOLLYWOOD"]
dedup_note = """
Not calibratable: OSM has 2 trees inside the line (2026-11).  10 m is the
cell these rows were deduplicated at as a partition of Los Angeles.
"""
dedup_cell_metres = 10
data_freshness = "probe"
satellite = true
predicted = true
predicted_staged_with = "USLAX"

[labels]
WEST_HOLLYWOOD = "West Hollywood Open Data"

[[tree_sources]]
label = "City of West Hollywood - City Tree Inventory (2015, CC0 1.0)"
url = "https://data.weho.org/Infrastructure/City-Tree-Inventory/qqwt-wx9z"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 50 14 * * SAT,TUE"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USWHO`.
"""

[jobs.osm]
schedule = "0 15 15 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 9 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
