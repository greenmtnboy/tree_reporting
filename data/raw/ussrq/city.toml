# Sarasota County's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USSRQ"
name = "Sarasota County"
slug = "sarasota"
center = [-82.4, 27.17]
ecoregion = 399
ecoregion_name = "Southeast US conifer savannas"
usda_zone = 10
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [26.93, 27.4, -82.58, -82.2]
territory = [[26.93, 27.4, -82.58, -82.2]]
municipal_sources = ["SARASOTA_COUNTY_OPENDATA"]
dedup_note = """
Calibrated 2026-11-28 (osm_dedup_validation): 8m flags 73, 2.7% false;
10m adds 0 true for 1 false.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
SARASOTA_COUNTY_OPENDATA = "Sarasota County Open Data"

[[tree_sources]]
label = "Sarasota County GIS - TreeInventory (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=d83796771ba64ea88f958c058ddcfa79"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USSRQ`.
"""

[jobs.osm]
schedule = "0 0 15 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 37 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
