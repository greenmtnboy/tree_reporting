# Moncton's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAMON"
name = "Moncton"
slug = "moncton"
center = [-64.7782, 46.0878]
ecoregion = 335
ecoregion_name = "Gulf of St. Lawrence lowland forests"
usda_zone = 5
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [46.02, 46.2, -64.95, -64.66]
territory = [[46.02, 46.2, -64.95, -64.66]]
municipal_sources = ["MONCTON_OPENDATA"]
dedup_note = """
Moncton's OSM presence is 477 nodes against 11,980 inventory trees, so
the 5-10 m band (n=2) says nothing and the marginal table decides:
4->6 removes 3 duplicates and hides none, 6->8 removes none and hides
one.  6 m is where the paying stops.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
MONCTON_OPENDATA = "Moncton Open Data"

[[tree_sources]]
label = "City of Moncton Open Data - Trees"
url = "https://open.moncton.ca/datasets/trees"

[[landmark_sources]]
label = "City of Moncton Open Data - Cultural Assets"
url = "https://open.moncton.ca/datasets/cultural-assets"

[jobs.city]
schedule = "0 40 21 * * TUE,FRI"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAMON`.
"""

[jobs.osm]
schedule = "0 30 4 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 24 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
