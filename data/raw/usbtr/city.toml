# Baton Rouge's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USBTR"
name = "Baton Rouge"
slug = "batonrouge"
center = [-91.1403, 30.4515]
ecoregion = 399
ecoregion_name = "Southeast US conifer savannas"
usda_zone = 9
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [30.22, 30.58, -91.27, -90.84]
territory = [[30.22, 30.58, -91.27, -90.84]]
municipal_sources = ["BATON_ROUGE_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-23): 6 m flags 155, 7 false (4.5%), recall 64%;
8 m adds 7 true for 2 false. OSM is sparse here (1,930 trees).
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
BATON_ROUGE_OPENDATA = "Baton Rouge Open Data"

[[tree_sources]]
label = "East Baton Rouge City-Parish GIS - Tree Inventory (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=51b996ab35bc44bfb8d9e8d032b458c7"

[[landmark_sources]]
label = "City of Baton Rouge-Parish of East Baton Rouge - Local Historic Landmarks (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=ef927acb261c48c3bbef735602b9f5dc"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USBTR`.
"""

[jobs.osm]
schedule = "0 30 12 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 52 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
