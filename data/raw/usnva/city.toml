# Northern Virginia's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USNVA"
name = "Northern Virginia"
slug = "nova"
center = [-77.3064, 38.8462]
ecoregion = 330
ecoregion_name = "Appalachian Piedmont forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [38.59, 39.07, -77.55, -77.03]
territory_note = """
The Potomac's Virginia shore, carved against USWAS; north of DC the
river bends west and the land east of it is Maryland, which is nobody's.
"""
territory = [
    [38.59, 38.78, -77.55, -77.03],
    [38.78, 38.8, -77.55, -77.04],
    [38.8, 38.82, -77.55, -77.039],
    [38.82, 38.84, -77.55, -77.043],
    [38.84, 38.86, -77.55, -77.031],
    [38.86, 38.875, -77.55, -77.052],
    [38.875, 38.89, -77.55, -77.058],
    [38.89, 38.9, -77.55, -77.068],
    [38.9, 38.91, -77.55, -77.075],
    [38.91, 38.92, -77.55, -77.09],
    [38.92, 38.94, -77.55, -77.115],
    [38.94, 38.96, -77.55, -77.14],
    [38.96, 38.99, -77.55, -77.18],
    [38.99, 39.03, -77.55, -77.24],
    [39.03, 39.07, -77.55, -77.3],
]
municipal_sources = ["ARLINGTON", "FALLS_CHURCH"]
dedup_note = """
Calibrated 2026-11-06 on the first build (31,351 staged OSM nodes against
37,828 Arlington and Falls Church anchors).  Mutual-NN 92.1% in the 2-5 m
band (n=581) collapsing to 31.8% in 5-10 m (n=264): guarantee 5 m.
"""
dedup_cell_metres = 10
data_freshness = "model"
data_freshness_comment = "derived in usnva/nova_tree_info.preql from its two inventories"

[labels]
ARLINGTON = "Arlington County Open Data"
FALLS_CHURCH = "City of Falls Church GIS"

[[tree_sources]]
label = "Arlington County GIS - DPR Trees (ArcGIS Hub)"
url = "https://gisdata-arlgis.opendata.arcgis.com/"

[[tree_sources]]
label = "City of Falls Church GIS - Public Trees (2004 inventory)"
url = "https://services1.arcgis.com/2hmXRAz4ofcdQP6p/arcgis/rest/services/Public_Trees/FeatureServer/0"

[[landmark_sources]]
label = "Fairfax County GIS - Inventory of Historic Sites"
url = "https://services1.arcgis.com/ioennV6PpG5Xodq0/arcgis/rest/services/Historic_Sites_Inventory/FeatureServer/0"

[jobs.city]
schedule = "0 20 16 * * TUE,FRI"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USNVA`.
"""

[jobs.osm]
schedule = "0 0 5 * * MON"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""
memory_mb_note = """
Fairfax County is ~1,000 km2; 1 GiB OOM-killed the bootstrap extract.
"""

[jobs.landmarks]
schedule = "0 26 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
