# Boulder's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USBOU"
name = "Boulder"
slug = "boulder"
center = [-105.2705, 40.015]
ecoregion = 402
ecoregion_name = "Western shortgrass prairie"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [39.95, 40.13, -105.35, -105.15]
territory = [[39.9569, 40.0945, -105.3015, -105.1783]]
municipal_sources = ["BOULDER_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
7,100 staged OSM nodes against 49,588 anchors.  Mutual-NN 92.9% in
2-5 m, 52.0% in 5-10 m (n=175): a 5 m guarantee caps it at 10.
Marginal table: 6->8 removes 52 duplicates for 23 hidden trees (2.26),
8->10 removes 17 for 21 (0.81), so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
BOULDER_OPENDATA = "City of Boulder"

[[tree_sources]]
label = "City of Boulder - Tree Inventory Open Data (ArcGIS, CC0)"
url = "https://gis.bouldercolorado.gov/ags_svr2/rest/services/parks/TreesOpenData/MapServer/0"

[[landmark_sources]]
label = "City of Boulder - Historic Landmarks (individual landmarks)"
url = "https://gis.bouldercolorado.gov/ags_svr1/rest/services/plan/HistoricLandmarks/MapServer/0"

[jobs.city]
schedule = "0 50 12 * * MON,THU"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USBOU`.
"""

[jobs.osm]
schedule = "0 30 5 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 44 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
