# Pittsburgh's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPIT"
name = "Pittsburgh"
slug = "pittsburgh"
center = [-79.9959, 40.4406]
ecoregion = 329
ecoregion_name = "Appalachian mixed mesophytic forests"
usda_zone = 6
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [40.36, 40.51, -80.1, -79.86]
territory = [[40.3615, 40.5011, -80.0954, -79.8658]]
municipal_sources = ["PITTSBURGH_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
8,363 staged OSM nodes against 40,185 anchors.  Mutual-NN 90.9% in
2-5 m, 38.3% in 5-10 m (n=579): a 5 m guarantee caps it at 10.
Marginal table: 6->8 removes 173 duplicates for 106 hidden trees (1.63),
8->10 removes 69 for 125 (0.55), so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
PITTSBURGH_OPENDATA = "Pittsburgh Open Data"

[[tree_sources]]
label = "City of Pittsburgh, Department of Public Works Forestry Division - City of Pittsburgh Trees (WPRDC, CC BY)"
url = "https://data.wprdc.org/dataset/city-trees"

[[landmark_sources]]
label = "City of Pittsburgh - City Designated Individual Historic Sites; National Park Service - National Register of Historic Places"
url = "https://data.wprdc.org/dataset/city-designated-individual-historic-sites"

[jobs.city]
schedule = "0 50 23 * * THU,SUN"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPIT`.
"""

[jobs.osm]
schedule = "0 30 6 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 16 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
