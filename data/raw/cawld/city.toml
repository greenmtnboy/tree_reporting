# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAWLD"
name = "Welland"
slug = "welland"
center = [-79.2483, 42.9922]
ecoregion = 342
ecoregion_name = "Southern Great Lakes forests"
usda_zone = 6
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [42.92, 43.05, -79.34, -79.16]
territory = [[42.92, 43.05, -79.34, -79.16]]
municipal_sources = ["WELLAND_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): OSM holds an import of this inventory
(11,988 OSM vs 11,605); 2 m already flags 11,591; 4 m adds 2, 6 m adds 3 for 1 false.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
WELLAND_OPENDATA = "Welland Open Data"

[[tree_sources]]
