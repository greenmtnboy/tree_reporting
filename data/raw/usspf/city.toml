# Springfield's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USSPF"
name = "Springfield"
slug = "springfield"
center = [-93.2923, 37.209]
ecoregion = 340
ecoregion_name = "Ozark Highlands mixed forests"
usda_zone = 6
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [37.08, 37.28, -93.44, -93.174]
territory = [[37.0885, 37.2771, -93.4132, -93.174]]
municipal_sources = ["SPRINGFIELD_MO_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-23): 6 m flags 305, 13 false (4.3%), recall 73%;
8 m adds 16 true for 9 false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
SPRINGFIELD_MO_OPENDATA = "Springfield Open Data"

[[tree_sources]]
label = "City of Springfield, MO - Tree Inventory (no licence stated; displayed with attribution only, not licensed for reuse). This data has been modified for use from its original source, www.springfieldmo.gov; the City makes no claims as to its content, accuracy, timeliness or completeness, and it is used at one's own risk"
url = "https://gisdata-cosmo.opendata.arcgis.com/datasets/705ae4c71b014910a0617ba5c7b25b98_34"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USSPF`.
"""

[jobs.osm]
schedule = "0 30 12 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 1 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
