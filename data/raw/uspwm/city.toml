# Portland, ME's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPWM"
name = "Portland, ME"
slug = "portlandme"
center = [-70.2568, 43.6591]
ecoregion = 339
ecoregion_name = "Northeast US Coastal forests"
usda_zone = 6
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [43.5443, 43.74, -70.35, -69.9758]
territory = [[43.5443, 43.7277, -70.3474, -69.9758]]
municipal_sources = ["PORTLAND_ME_OPENDATA"]
dedup_note = """
Calibrated 2026-11-28 (osm_dedup_validation): 8m flags 147, 1.4% false;
10m adds 1 true for 2 false.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
PORTLAND_ME_OPENDATA = "Portland, ME Open Data"

[[tree_sources]]
label = "City of Portland Forestry - City Owned Trees (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://gis.portlandmaine.gov/portal/home/item.html?id=b12173632dfd448aa7a5bea80b6da47b"

[[landmark_sources]]
label = "City of Portland - Local Landmarks (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://gis.portlandmaine.gov/portal/home/item.html?id=13d2773085ab41a1afad4f79d7b4b9d6"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPWM`.
"""

[jobs.osm]
schedule = "0 15 15 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 51 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
