# Riverside's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USRAL"
name = "Riverside"
slug = "riverside"
center = [-117.3962, 33.9533]
ecoregion = 422
ecoregion_name = "California coastal sage and chaparral"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "nearctic"
bounds = [33.85, 34.03, -117.53, -117.27]
territory = [[33.8725, 34.0194, -117.5239, -117.2789]]
municipal_sources = ["RIVERSIDE_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-21: 8m 503/35 (7.0%), marginal 3.4; 10m 0.6.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
RIVERSIDE_OPENDATA = "Riverside Open Data"

[[tree_sources]]
label = "City of Riverside Open Data - Street, Park, Utility-Line and Miscellaneous Trees, April 2023 (no licence stated; the City Open Data Policy asks for the credit \"Data provided by the City of Riverside\")"
url = "https://www.arcgis.com/home/item.html?id=18ac0db05b7340d1b463d953fdc672fc"

[[landmark_sources]]
label = "City of Riverside - Historic Properties Designations, City Landmarks (\"Data provided by the City of Riverside\"); National Park Service - National Register of Historic Places"
url = "https://www.arcgis.com/home/item.html?id=c0310676be0b427d831b64e19d26c122"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USRAL`.
"""

[jobs.osm]
schedule = "0 45 10 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 48 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
