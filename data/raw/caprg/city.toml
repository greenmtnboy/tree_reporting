# Prince George's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAPRG"
name = "Prince George"
slug = "princegeorge"
center = [-122.7497, 53.9171]
ecoregion = 350
ecoregion_name = "Central British Columbia Mountain forests"
usda_zone = 3
biome = "Temperate Conifer Forests"
realm = "nearctic"
bounds = [53.8, 54.05, -122.95, -122.6]
territory = [[53.8, 54.05, -122.95, -122.6]]
municipal_sources = ["PRINCE_GEORGE_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): 567 OSM trees, none within 28 m of an
inventory tree, so nothing to calibrate against; smallest cell kept.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
PRINCE_GEORGE_OPENDATA = "Prince George Open Data"

[[tree_sources]]
label = "City of Prince George - Trees (Open Government License - City of Prince George; contains information licensed under the Open Government License - City of Prince George)"
url = "https://www.arcgis.com/home/item.html?id=382244b24c054f0ab92ca9d76facd44c"

[[landmark_sources]]
label = "City of Prince George - Heritage Register (no licence stated; displayed with attribution only, not licensed for reuse), placed on City civic address points (Open Government License - City of Prince George)"
url = "https://www.princegeorge.ca/community-culture/heritage/heritage-register-properties"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAPRG`.
"""

[jobs.osm]
schedule = "0 15 12 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 36 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
