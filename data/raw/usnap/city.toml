# Naples, FL's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USNAP"
name = "Naples, FL"
slug = "naples"
center = [-81.7948, 26.142]
osm_name = "Naples"
ecoregion = 399
ecoregion_name = "Southeast US conifer savannas"
usda_zone = 10
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [26.05, 26.3, -81.85, -81.7]
territory = [[26.0789, 26.2113, -81.8204, -81.7666]]
municipal_sources = ["NAPLES_OPENDATA"]
dedup_note = """
Calibrated 2026-11-12 on the first build (tools/osm_dedup_validation.py).
12,738 staged OSM nodes against 29,366 anchors.  Mutual-NN 70.2% in
2-5 m, 8.7% in 5-10 m (n=23): a 5 m guarantee.  Marginal table: 2->4
removes 81 duplicates for 17 hidden trees (4.76), 4->6 removes 10 for 16
(0.62), so the paying stops at 4 m.
"""
dedup_cell_metres = 4
data_freshness = "probe"
data_freshness_comment = "when Naples data is through"
osm_freshness_comment = "GCS publication time of Naples's staged OSM parquet"

[labels]
NAPLES_OPENDATA = "City of Naples"

[[tree_sources]]
label = "City of Naples - City Trees (ArcGIS)"
url = "https://g.naplesgov.com/arcgis/rest/services/Community_Services/CityTrees/FeatureServer/0"

[[landmark_sources]]
label = "City of Naples - Historic Buildings; National Park Service - National Register of Historic Places"
url = "https://g.naplesgov.com/arcgis/rest/services/Building/HistoricBuildings/MapServer/0"

[jobs.city]
schedule = "0 40 8 * * WED,SAT"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USNAP`.
"""

[jobs.osm]
schedule = "0 30 5 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 38 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
