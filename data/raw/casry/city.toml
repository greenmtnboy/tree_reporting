"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
SURREY_OPENDATA = "Surrey Open Data"

[[tree_sources]]
label = "City of Surrey - Park Specimen Trees (Open Government License - City of Surrey; contains information licensed under the Open Government License - City of Surrey)"
url = "https://opendata-surrey.hub.arcgis.com/datasets/626b2212e0594eadb8a86ccf0b9640c2"

[[landmark_sources]]
label = "City of Surrey Heritage Register - Heritage Sites (Open Government License - City of Surrey)"
url = "https://opendata-surrey.hub.arcgis.com/datasets/b65ea74c6e4743928ae25392935ca08f"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CASRY`.
"""

[jobs.osm]
schedule = "0 45 11 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 26 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
