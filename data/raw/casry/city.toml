# Surrey's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CASRY"
name = "Surrey"
slug = "surrey"
center = [-122.849, 49.1913]
ecoregion = 364
ecoregion_name = "Puget lowland forests"
usda_zone = 8
biome = "Temperate Conifer Forests"
