# Vienna's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "ATVIE"
name = "Vienna"
slug = "vienna"
center = [16.3738, 48.2082]
ecoregion = 674
ecoregion_name = "Pannonian mixed forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [48.11, 48.33, 16.18, 16.58]
territory = [[48.11, 48.33, 16.18, 16.58]]
municipal_sources = ["VIENNA_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
177,557 staged OSM nodes against 229,635 anchors; 121k of them sit
within 2 m of an inventory tree (OSM imported the Baumkataster).
Mutual-NN 57.7% in 2-5 m (n=9,675): a 2 m guarantee caps it at 4.
Marginal table: 2->4 removes 5,389 duplicates for 2,052 hidden trees
(2.63), 4->6 removes 1,947 for 2,496 (0.78), so 4 m.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
VIENNA_OPENDATA = "Vienna Open Data"

[[tree_sources]]
label = "Stadt Wien Open Data - Baumkataster (BAUMKATOGD, CC BY 4.0; Datenquelle: Stadt Wien - data.wien.gv.at)"
url = "https://www.data.gv.at/katalog/dataset/c91a4635-8b7d-43fe-9b27-d95dec8392a7"

[[landmark_sources]]
label = "Stadt Wien Open Data - Historische Gartenanlagen and Sehenswürdigkeiten (CC BY 4.0)"
url = "https://data.wien.gv.at/"

[jobs.city]
schedule = "0 30 18 * * WED,SAT"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city ATVIE`.
"""

[jobs.osm]
schedule = "0 0 6 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 58 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
