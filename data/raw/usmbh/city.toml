# Marblehead's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USMBH"
name = "Marblehead"
slug = "marblehead"
center = [-70.8578, 42.5001]
ecoregion = 339
ecoregion_name = "Northeast US Coastal forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [42.4554, 42.5288, -70.8991, -70.7675]
territory = [[42.4554, 42.5288, -70.8991, -70.7675]]
municipal_sources = []
dedup_cell_metres = 10
data_freshness = "none"
satellite = true
predicted = true
predicted_staged_with = "USBOS"

[[tree_sources]]
label = "Community submissions, OpenStreetMap and the Boston metro aerial-imagery run (no municipal inventory)"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 10 14 * * MON,THU"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USMBH`.
"""

[jobs.osm]
schedule = "0 0 14 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 9 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
