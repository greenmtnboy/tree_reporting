# Lisbon's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "PTLIS"
name = "Lisbon"
slug = "lisbon"
center = [-9.1393, 38.7223]
ecoregion = 805
ecoregion_name = "Southwest Iberian Mediterranean sclerophyllous and mixed forests"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "palearctic"
bounds = [38.68, 38.8, -9.24, -9.08]
territory = [[38.68, 38.8, -9.24, -9.08]]
municipal_sources = ["LISBON_OPENDATA"]
dedup_note = """
Lisbon: calibrated 2026-11-17 with --inventory-parquet (75,839 anchors)
against the staged extract. Mutual-NN 84.9% in 2-5 m, 33.5% in 5-10 m
(n=892): a 5 m guarantee caps it at 10. Marginal table: 4->6 removes 483
duplicates for 246 hidden trees (1.96), 6->8 removes 198 for 297 (0.67),
so 6 m.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
LISBON_OPENDATA = "Lisbon Open Data"

[[tree_sources]]
label = "Câmara Municipal de Lisboa - Arvoredo (Lisboa Aberta, CC0)"
url = "https://dados.cm-lisboa.pt/dataset/arvoredo"

[[landmark_sources]]
label = "Câmara Municipal de Lisboa - Património classificado and Estatuária (CC0)"
url = "https://services.arcgis.com/1dSrzEWVQn5kHHyK/arcgis/rest/services/Patrimonio/FeatureServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city PTLIS`.
"""

[jobs.osm]
schedule = "0 30 7 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 42 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
