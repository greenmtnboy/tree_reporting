# Bern's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CHBRN"
name = "Bern"
slug = "bern"
center = [7.4474, 46.948]
ecoregion = 686
ecoregion_name = "Western European broadleaf forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [46.9, 47.0, 7.28, 7.5]
territory = [[46.9, 47.0, 7.28, 7.5]]
municipal_sources = ["BERN_OPENDATA"]
dedup_note = """
Calibrated 2026-11-18: 6m cell: recall 95.3%, 3.2% false; 8m adds +122 true / +190 false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
BERN_OPENDATA = "Bern Open Data"

[[tree_sources]]
label = "Stadt Bern - Baumkataster (Stadtgrün Bern; opendata.swiss open use)"
url = "https://opendata.swiss/en/dataset/baumkataster1"

[[landmark_sources]]
label = "Stadt Bern - Sehenswürdigkeiten and Bauinventar Baugruppen (opendata.swiss open use)"
url = "https://opendata.swiss/en/dataset/bauinventar1"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CHBRN`.
"""

[jobs.osm]
schedule = "0 45 8 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 6 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
