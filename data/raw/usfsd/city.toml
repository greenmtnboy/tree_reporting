# Sioux Falls's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USFSD"
name = "Sioux Falls"
slug = "siouxfalls"
center = [-96.7311, 43.5446]
ecoregion = 388
ecoregion_name = "Central Tallgrass prairie"
usda_zone = 5
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [43.45, 43.6454, -96.8607, -96.5981]
territory = [[43.4642, 43.6454, -96.8607, -96.5981]]
municipal_sources = ["SIOUXFALLS_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): 6 m flags 1,245, 0.9% false, 85.6% recall;
8 m adds 62 for 28 more false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
SIOUXFALLS_OPENDATA = "Sioux Falls Open Data"

[[tree_sources]]
label = "City of Sioux Falls GIS - Trees (CC BY 4.0)"
url = "https://www.arcgis.com/home/item.html?id=c880d62ae5fb4652b1f8e6cbca244107"

[[landmark_sources]]
label = "City of Sioux Falls - Historic Properties (local register, CC BY 4.0); National Park Service - National Register of Historic Places"
url = "https://www.arcgis.com/home/item.html?id=7b0407feca3e4f47bfe54559b9c1dd5d"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USFSD`.
"""

[jobs.osm]
schedule = "0 45 11 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 22 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
