# East Lansing's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USELN"
name = "East Lansing"
slug = "east_lansing"
center = [-84.4839, 42.737]
ecoregion = 342
ecoregion_name = "Southern Great Lakes forests"
usda_zone = 6
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [42.6969, 42.8019, -84.5133, -84.4388]
territory = [[42.6969, 42.8019, -84.5133, -84.4388]]
municipal_sources = ["EAST_LANSING"]
dedup_note = """
East Lansing: NOT YET CALIBRATED: default; measure after the first build.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
EAST_LANSING = "City of East Lansing"

[[tree_sources]]
label = "City of East Lansing - Trees, current status (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://gis2.cityofeastlansing.com/arcgis/rest/services/TREES_STATUS/FeatureServer/0"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USELN`.
"""

[jobs.osm]
schedule = "0 45 20 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 59 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
