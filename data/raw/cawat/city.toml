"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
WATERLOO_OPENDATA = "Waterloo Open Data"

[[tree_sources]]
label = "City of Waterloo - Street Tree Inventory (Waterloo Open Data User Licence)"
url = "https://data.waterloo.ca/datasets/2447415303e74bb9acdf0f43c2236b72"

[[landmark_sources]]
label = "City of Waterloo - Heritage Buildings, Municipal Heritage Register (Waterloo Open Data User Licence)"
url = "https://data.waterloo.ca/datasets/3822d7856d034f07a14e67e25c6ced4b"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAWAT`.
"""

[jobs.osm]
schedule = "0 45 9 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 30 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
