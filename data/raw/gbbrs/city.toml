# Bristol's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "GBBRS"
name = "Bristol"
slug = "bristol"
center = [-2.5879, 51.4545]
ecoregion = 663
ecoregion_name = "English Lowlands beech forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [51.39, 51.55, -2.73, -2.5]
territory = [[51.39, 51.55, -2.73, -2.5]]
municipal_sources = ["BRISTOL_OPENDATA"]
dedup_note = """
Bristol: calibrated 2026-11-17 with --inventory-parquet (55,947 anchors)
against the staged extract. Mutual-NN 29.2% in 10-20 m (n=233): a 10 m
guarantee caps it at 20. Marginal table: 8->10 removes 107 duplicates for
46 hidden trees (2.33), 10->14 removes 66 for 81 (0.81), so 10 m.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
BRISTOL_OPENDATA = "Bristol Open Data"

[[tree_sources]]
label = "Bristol City Council - Trees (Open Government Licence v3.0)"
url = "https://www.arcgis.com/home/item.html?id=7a99218a4bf347ff948f0e5882406a8c"

[[landmark_sources]]
label = "Historic England - National Heritage List for England (OGL)"
url = "https://historicengland.org.uk/listing/the-list/"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city GBBRS`.
"""

[jobs.osm]
schedule = "0 30 7 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 46 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
