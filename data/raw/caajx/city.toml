biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [43.78, 43.95, -79.13, -78.93]
territory_note = """
Ajax's east edge follows Whitby's boundary (see CAWHI).
"""
territory = [
    [43.78, 43.81, -79.1, -78.93],
    [43.81, 43.82, -79.1, -78.966],
    [43.82, 43.83, -79.1, -78.969],
