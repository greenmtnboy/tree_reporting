municipal_sources = ["AJAX_OPENDATA"]
dedup_note = """
5-10 m band 25.7% mutual-NN over n=74: neighbour-dominated, and Ajax
plants tight (median 9.1 m to the nearest other inventory tree, a
quarter within 6.4 m).  4->6 removes 62 duplicates for 9 hidden trees
(6.89), 6->8 removes 13 for 21 (0.62).
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
AJAX_OPENDATA = "Ajax Open Data"

[[tree_sources]]
label = "Town of Ajax Open Data - Town Trees"
url = "https://opendata.ajax.ca/datasets/town-trees"

[[landmark_sources]]
label = "Town of Ajax Open Data - Heritage Inventory"
url = "https://opendata.ajax.ca/datasets/heritage-inventory"

[jobs.city]
schedule = "0 20 21 * * MON,THU"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAAJX`.
"""

[jobs.osm]
schedule = "0 0 4 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 4 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
