# Redlands's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USRDL"
name = "Redlands"
slug = "redlands"
center = [-117.1825, 34.0556]
ecoregion = 422
ecoregion_name = "California coastal sage and chaparral"
usda_zone = 9
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "nearctic"
bounds = [34.0, 34.1027, -117.26, -117.0524]
territory = [[34.0034, 34.1027, -117.2491, -117.0524]]
municipal_sources = ["REDLANDS_OPENDATA"]
dedup_note = """
Calibrated 2026-11-23 (osm_dedup_validation): 4m flags 829, 2.3% false;
6m adds 78 true for 38 false (6.0% false).
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
REDLANDS_OPENDATA = "Redlands Open Data"

[[tree_sources]]
label = "City of Redlands - Street Trees (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=9f9d4ad74a0d44fba8bf27c829e810f2"

[[landmark_sources]]
label = "City of Redlands - Historic Buildings and Structures (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=3701fa66edc9456d87a0584c9c011122"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USRDL`.
"""

[jobs.osm]
schedule = "0 0 12 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 19 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
