# Cologne's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "DECGN"
name = "Cologne"
slug = "cologne"
center = [6.9603, 50.9375]
ecoregion = 664
ecoregion_name = "European Atlantic mixed forests"
usda_zone = 8
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [50.83, 51.09, 6.77, 7.17]
territory = [[50.83, 51.09, 6.77, 7.17]]
municipal_sources = ["COLOGNE_OPENDATA"]
dedup_note = """
Cologne: osm_dedup_validation.py --inventory-parquet: mutual-NN 91.5% in
2-5 m, 36.3% in 5-10 m (n=1,068): a 5 m guarantee caps it at 10.
Marginal table: 6->8 removes 260 duplicates for 219 hidden trees (1.19),
8->10 removes 115 for 227 (0.51), so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
COLOGNE_OPENDATA = "Cologne Open Data"

[[tree_sources]]
label = "Stadt Köln Offene Daten - Baumkataster (Amt für Landschaftspflege und Grünflächen, Datenlizenz Deutschland Zero 2.0)"
url = "https://offenedaten-koeln.de/dataset/baumkataster-koeln-fortlaufend-aktualisiert"

[[landmark_sources]]
label = "Stadt Köln Offene Daten - Denkmalliste, named monuments (Datenlizenz Deutschland Zero 2.0)"
url = "https://offenedaten-koeln.de/dataset/liste-der-koelner-denkmaeler"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city DECGN`.
"""

[jobs.osm]
schedule = "0 0 7 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 32 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
