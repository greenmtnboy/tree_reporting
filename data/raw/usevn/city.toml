# Evanston's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USEVN"
name = "Evanston"
slug = "evanston"
center = [-87.6877, 42.0451]
ecoregion = 387
ecoregion_name = "Central US forest-grasslands transition"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [42.0, 42.09, -87.75, -87.65]
territory = [[42.0191, 42.0718, -87.7325, -87.665]]
municipal_sources = ["EVANSTON_OPENDATA"]
dedup_note = """
Calibrated 2026-11-24 (osm_dedup_validation): 4m flags 108, 2.8% false;
6m adds 16 true for 9 false (9.0% false).
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
EVANSTON_OPENDATA = "Evanston Open Data"

[[tree_sources]]
label = "City of Evanston Open Data - Trees (CC BY 4.0)"
url = "https://www.arcgis.com/home/item.html?id=845a3acb3dc0442a80b219691889f992"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USEVN`.
"""

[jobs.osm]
schedule = "0 0 12 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 29 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
