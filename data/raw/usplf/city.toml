# Plainfield, IL's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPLF"
name = "Plainfield, IL"
slug = "plainfield"
center = [-88.2042, 41.6097]
ecoregion = 387
ecoregion_name = "Central US forest-grasslands transition"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [41.5692, 41.6802, -88.3026, -88.1628]
territory = [[41.5692, 41.6802, -88.3026, -88.1628]]
municipal_sources = ["PLAINFIELD_PARK_DISTRICT"]
dedup_note = """
Plainfield, IL: NOT YET CALIBRATED: default; measure after the first build.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
PLAINFIELD_PARK_DISTRICT = "Plainfield Park District"

[[tree_sources]]
label = "Plainfield Park District - Public Trees, park trees only (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://services8.arcgis.com/eOqUuAWRL4PqiMCt/arcgis/rest/services/Plainfield_Public_Trees/FeatureServer/0"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPLF`.
"""

[jobs.osm]
schedule = "0 0 21 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 1 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
