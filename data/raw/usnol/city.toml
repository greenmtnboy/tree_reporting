# New Orleans's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USNOL"
name = "New Orleans"
slug = "new_orleans"
center = [-90.0715, 29.9511]
ecoregion = 337
ecoregion_name = "Mississippi lowland forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [29.85, 30.2, -90.15, -89.6]
territory = [[29.8666, 30.1987, -90.1401, -89.625]]
municipal_sources = ["NEW_ORLEANS_OPENDATA"]
dedup_note = """
Calibrated 2026-11-12 on the first build (tools/osm_dedup_validation.py).
941 staged OSM nodes against 104,407 anchors.  Mutual-NN stays above 60%
through 20 m, so the band rule says nothing and the marginal table
decides: 6->8 removes 29 duplicates for 2 hidden trees (14.5), 8->10
removes 5 for 10 (0.50).
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
NEW_ORLEANS_OPENDATA = "New Orleans Open Data"

[[tree_sources]]
label = "City of New Orleans - Parks and Parkways tree assets (311 asset service, ArcGIS)"
url = "https://maps.nola.gov/server/rest/services/OpenGov/OpenGov311_Assets/MapServer/7"

[[landmark_sources]]
label = "City of New Orleans - HDLC Landmarks (Historic District Landmarks Commission)"
url = "https://maps.nola.gov/server/rest/services/Administrative/Historic_Preservation/MapServer/0"

[jobs.city]
schedule = "0 0 8 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USNOL`.
"""

[jobs.osm]
schedule = "0 0 5 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 34 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
