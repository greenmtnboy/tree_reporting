# San Jose's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USSJC"
name = "San Jose"
slug = "sanjose"
center = [-121.8863, 37.3382]
ecoregion = 423
ecoregion_name = "California interior chaparral and woodlands"
usda_zone = 9
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "nearctic"
bounds = [37.12, 37.47, -122.05, -121.58]
territory = [[37.1231, 37.4692, -122.0457, -121.5858]]
municipal_sources = ["SANJOSE_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
12,059 staged OSM nodes against 267,111 anchors.  The 5-10 m band is
neighbour-dominated: a 5 m guarantee caps it at 10.
Marginal table: 4->6 removes 128 duplicates for 24 hidden trees (5.33),
6->8 removes 40 for 44 (0.91), so 6 m.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
SANJOSE_OPENDATA = "San Jose Open Data"

[[tree_sources]]
label = "City of San José - Street Tree (ArcGIS, CC BY)"
url = "https://data.sanjoseca.gov/dataset/street-tree"

[[landmark_sources]]
label = "City of San José - Historic Resources Inventory, City Landmarks (CC BY); National Park Service - National Register of Historic Places"
url = "https://data.sanjoseca.gov/dataset/historical-resources-inventory"

[jobs.city]
schedule = "0 50 7 * * FRI,MON"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USSJC`.
"""

[jobs.osm]
schedule = "0 30 6 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 18 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
