# Brest's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "FRBES"
name = "Brest"
slug = "brest"
center = [-4.4861, 48.3904]
ecoregion = 664
ecoregion_name = "European Atlantic mixed forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [48.32, 48.48, -4.65, -4.31]
territory = [[48.32, 48.48, -4.65, -4.31]]
municipal_sources = ["BREST_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-20: 8m 4037/107 (2.6%), marginal 2.1; 10m below 1.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
BREST_OPENDATA = "Brest Open Data"

[[tree_sources]]
label = "Brest métropole - Les arbres (Licence Ouverte v2.0; species and position only)"
url = "https://www.data.gouv.fr/datasets/les-arbres/"

[[landmark_sources]]
label = "Ministère de la Culture - Immeubles protégés au titre des Monuments Historiques (Licence Ouverte)"
url = "https://www.data.gouv.fr/datasets/immeubles-proteges-au-titre-des-monuments-historiques-2"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city FRBES`.
"""

[jobs.osm]
schedule = "0 15 10 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 44 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
