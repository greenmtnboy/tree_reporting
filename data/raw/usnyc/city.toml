# New York City's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USNYC"
name = "New York City"
slug = "nyc"
center = [-73.9665, 40.7812]
ecoregion = 339
ecoregion_name = "Northeast US Coastal forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [40.45, 40.95, -74.3, -73.65]
territory = [[40.4765, 40.9178, -74.2589, -73.7001]]
municipal_sources = ["NYC_OPENDATA"]
dedup_note = """
53.3% over n=5,059: a coin flip, so the band is left unmatched.
"""
dedup_cell_metres = 10
data_freshness = "probe"
data_freshness_comment = "when NYC data is through"
satellite = true

[labels]
NYC_OPENDATA = "NYC Open Data"

[[tree_sources]]
label = "NYC Open Data Street Tree Census"
url = "https://data.cityofnewyork.us/Environment/2015-Street-Tree-Census-Tree-Data/uvpi-gqnh"

[[landmark_sources]]
label = "NYC LPC Individual Landmark Sites"
url = "https://data.cityofnewyork.us/Housing-Development/Individual-Landmark-Sites/buis-pvji"

[jobs.city]
schedule = "0 20 10 * * *"
timeout_seconds = 2400
memory_mb = 3072

[jobs.osm]
schedule = "0 0 2 * * TUE"
timeout_seconds = 2400
memory_mb = 2048

[jobs.landmarks]
schedule = "0 14 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
