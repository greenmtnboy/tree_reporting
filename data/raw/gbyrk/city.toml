# York's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "GBYRK"
name = "York"
slug = "york"
center = [-1.082, 53.959]
ecoregion = 651
ecoregion_name = "Celtic broadleaf forests"
usda_zone = 8
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [53.87, 54.06, -1.23, -0.91]
territory = [[53.87, 54.06, -1.23, -0.91]]
municipal_sources = ["YORK_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-21: 8m 3519/146 (4.1%), marginal 4.0; 10m 1.4.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
YORK_OPENDATA = "York Open Data"

[[tree_sources]]
label = "City of York Council - Council owned trees and Private trees (Open Government Licence v3.0; contains Ordnance Survey data © Crown copyright and database right)"
url = "https://data.yorkopendata.org/dataset/council-owned-trees"

[[landmark_sources]]
label = "Historic England - National Heritage List for England (Open Government Licence)"
url = "https://historicengland.org.uk/listing/the-list/"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city GBYRK`.
"""

[jobs.osm]
schedule = "0 15 11 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 6 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
