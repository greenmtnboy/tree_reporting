# Frankfurt's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "DEFRA"
name = "Frankfurt"
slug = "frankfurt"
center = [8.6821, 50.1109]
ecoregion = 686
ecoregion_name = "Western European broadleaf forests"
usda_zone = 8
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [50.01, 50.24, 8.47, 8.81]
territory = [[50.01, 50.24, 8.47, 8.81]]
municipal_sources = ["FRANKFURT_OPENDATA"]
dedup_note = """
Frankfurt: osm_dedup_validation.py --inventory-parquet: mutual-NN 91.8% in
2-5 m, 40.8% in 5-10 m (n=995): a 5 m guarantee caps it at 10.
Marginal table: 6->8 removes 292 duplicates for 183 hidden trees (1.60),
8->10 removes 128 for 208 (0.62), so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
FRANKFURT_OPENDATA = "Frankfurt Open Data"

[[tree_sources]]
label = "Stadt Frankfurt am Main Offene Daten - Baumkataster (Grünflächenamt, dl-de/by-2.0)"
url = "https://offenedaten.frankfurt.de/dcat/dataset/de-he-frankfurtam-baumkataster_op.html"

[[landmark_sources]]
label = "Stadt Frankfurt am Main, Umweltamt - Naturdenkmale and Geschützte Landschaftsbestandteile (WFS, dl-de/by-2.0)"
url = "https://geowebdienste.frankfurt.de/WFS_Naturdenkmale?request=GetCapabilities&service=WFS"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city DEFRA`.
"""

[jobs.osm]
schedule = "0 0 7 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 34 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
