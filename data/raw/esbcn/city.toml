# Barcelona's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "ESBCN"
name = "Barcelona"
slug = "barcelona"
center = [2.1686, 41.3874]
ecoregion = 799
ecoregion_name = "Northeast Spain and Southern France Mediterranean forests"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "palearctic"
bounds = [41.32, 41.47, 2.05, 2.23]
territory = [[41.32, 41.47, 2.05, 2.23]]
municipal_sources = ["BARCELONA_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): 4 m flags 42,137, 1,116 false (2.6%), recall 93%;
6 m adds 1,634 for 1,426 more false.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
BARCELONA_OPENDATA = "Barcelona Open Data"

[[tree_sources]]
label = "Ajuntament de Barcelona - Atles de la Biodiversitat, tree inventory (Open Data BCN, CC BY 4.0)"
url = "https://opendata-ajuntament.barcelona.cat/data/en/dataset/atles-biodiversitat-arbrat-geometries"

[[landmark_sources]]
label = "Ajuntament de Barcelona - Punts d'interès cultural (Open Data BCN, CC BY 4.0)"
url = "https://opendata-ajuntament.barcelona.cat/data/en/dataset/punts-informacio-turistica"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city ESBCN`.
"""

[jobs.osm]
schedule = "0 15 12 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 48 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
