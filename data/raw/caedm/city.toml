# Edmonton's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAEDM"
name = "Edmonton"
slug = "edmonton"
center = [-113.4938, 53.5461]
ecoregion = 386
ecoregion_name = "Canadian Aspen forests and parklands"
usda_zone = 4
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [53.3, 53.75, -113.8, -113.2]
territory = [[53.3, 53.75, -113.8, -113.2]]
municipal_sources = ["EDMONTON_OPENDATA", "ST_ALBERT"]
dedup_note = """
5-10 m band 32.2% over n=273; 4->6 removes 271 duplicates for 115 hidden
(2.36), 6->8 removes 71 for 74 (0.96), 8->10 removes 27 for 52 (0.52).
"""
dedup_cell_metres = 6
data_freshness = "model"
data_freshness_comment = "derived in caedm/edmonton_tree_info.preql from its two inventories"

[labels]
EDMONTON_OPENDATA = "Edmonton Open Data"
ST_ALBERT = "City of St. Albert Open Data"

[[tree_sources]]
label = "City of Edmonton Open Data - Trees"
url = "https://data.edmonton.ca/Environmental-Services/Trees/eecg-fc54"

[[tree_sources]]
label = "City of St. Albert - Tree Inventory (Open Data Licence - City of St. Albert)"
url = "https://www.arcgis.com/home/item.html?id=4cd6fa57df0b44b895ca6dd69118f10a"

[[landmark_sources]]
label = "City of Edmonton Open Data - Register and Inventory of Historic Resources"
url = "https://data.edmonton.ca/City-Administration/The-Register-and-Inventory-of-Historic-Resources-in/jgsn-dhai"

[jobs.city]
schedule = "0 20 16 * * MON,THU"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAEDM`.
"""

[jobs.osm]
schedule = "0 30 2 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 10 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
