# Belfast's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "GBBFS"
name = "Belfast"
slug = "belfast"
center = [-5.9301, 54.5973]
ecoregion = 651
ecoregion_name = "Celtic broadleaf forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [54.53, 54.66, -6.05, -5.8]
territory = [[54.53, 54.66, -6.05, -5.8]]
municipal_sources = ["BELFAST_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-21: 8m 5434/409 (7.5%), marginal 5.0; 10m 1.8.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
BELFAST_OPENDATA = "Belfast Open Data"

[[tree_sources]]
label = "Belfast City Council - Belfast Trees (Open Government Licence v3.0)"
url = "https://www.opendatani.gov.uk/dataset/belfast-trees"

[[landmark_sources]]
label = "Department for Communities NI, Historic Environment Division - listed buildings and scheduled monuments (Open Government Licence v3.0)"
url = "https://www.opendatani.gov.uk/dataset/historic-environment-division-esri-rest-api"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city GBBFS`.
"""

[jobs.osm]
schedule = "0 45 10 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 54 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
