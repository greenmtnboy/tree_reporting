# Ottawa's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAOTT"
name = "Ottawa"
slug = "ottawa"
center = [-75.6972, 45.4215]
ecoregion = 334
ecoregion_name = "Eastern Great Lakes lowland forests"
usda_zone = 5
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [44.92, 45.58, -76.4, -75.2]
territory = [[44.92, 45.58, -76.4, -75.2]]
municipal_sources = ["OTTAWA_OPENDATA"]
dedup_note = """
The largest overlap measured anywhere: 235,651 OSM nodes against 304,164
inventory trees, 147,736 of them within 2 m of one at 98.7% mutual-NN --
the National Capital Commission inventory was imported into OSM, and
62.8% of the nodes still carry the municipal id in `osm_ref`.  5-10 m
collapses to 23.3% over n=11,307, and the marginal table turns in the
usual place: 4->6 removes 5,778 duplicates for 3,890 hidden trees (1.49),
6->8 removes 1,940 for 3,320 (0.58).
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
OTTAWA_OPENDATA = "Ottawa Open Data"

[[tree_sources]]
label = "City of Ottawa Open Data - Tree Inventory"
url = "https://open.ottawa.ca/datasets/tree-inventory"

[[landmark_sources]]
label = "City of Ottawa Open Data - Cultural Spaces Inventory (Heritage)"
url = "https://open.ottawa.ca/datasets/ottawa::cultural-spaces-inventory-heritage"

[jobs.city]
schedule = "0 40 20 * * SAT,TUE"
timeout_seconds = 3600
memory_mb = 3072
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAOTT`.
"""
timeout_seconds_note = """
Ottawa is the slowest read in the fleet and the heaviest merge outside
Berlin: its MapServer caps a page at 1,000 rows and answers one in ~6.6s,
so 304k trees is ~34 minutes of paging on its own, and its OSM partition
is 235,651 nodes -- more OSM trees than any city except Berlin, because
the NCC inventory was imported into OSM (147,998 rows carry an osm_ref).
1800s was measured to be too small before the first build, not after.
"""

[jobs.osm]
schedule = "0 0 4 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 30 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
