# Barrie's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CABAR"
name = "Barrie"
slug = "barrie"
center = [-79.6903, 44.3894]
ecoregion = 334
ecoregion_name = "Eastern Great Lakes lowland forests"
usda_zone = 5
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [44.3, 44.45, -79.78, -79.6]
territory = [[44.3, 44.45, -79.78, -79.6]]
municipal_sources = ["BARRIE_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): only 235 OSM trees; 4 m flags 33, 1 false;
6 m adds 2 for 1 more false.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
BARRIE_OPENDATA = "Barrie Open Data"

[[tree_sources]]
label = "City of Barrie Open Data - Tree (Open Government Licence - Barrie; contains information licensed under the Open Government Licence - Barrie)"
url = "https://opendata.barrie.ca/datasets/d053284adf6341d7939486d13bfd6911"

[[landmark_sources]]
label = "City of Barrie Municipal Heritage Register - Heritage Properties (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=aa31258e142d4a7e9a01567e8fc2550f"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CABAR`.
"""

[jobs.osm]
schedule = "0 45 11 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 30 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
