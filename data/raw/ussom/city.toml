# Somerville's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USSOM"
name = "Somerville"
slug = "somerville"
center = [-71.0995, 42.3876]
ecoregion = 339
ecoregion_name = "Northeast US Coastal forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [42.36, 42.43, -71.15, -71.06]
territory = [[42.3725, 42.4182, -71.1347, -71.0726]]
municipal_sources = ["SOMERVILLE"]
dedup_note = """
Boston's cell, not a copy of it: these five towns' inventories were
partitions of Boston's model when its cell was grounded at the 5 m
break, so that measurement was taken over these rows.  Re-measure a
town on its own once it has published (osm_dedup_validation.py).
"""
dedup_cell_metres = 10
data_freshness = "probe"
satellite = true
predicted = true
predicted_staged_with = "USBOS"

[labels]
SOMERVILLE = "City of Somerville"

[[tree_sources]]
label = "City of Somerville - TreeKeeper public tree inventory"
url = "https://somervillema.treekeepersoftware.com/"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 20 11 * * THU,SUN"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USSOM`.
"""

[jobs.osm]
schedule = "0 15 3 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 41 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
