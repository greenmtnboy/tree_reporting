# Nantes's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "FRNTE"
name = "Nantes"
slug = "nantes"
center = [-1.5536, 47.2184]
ecoregion = 664
ecoregion_name = "European Atlantic mixed forests"
usda_zone = 8
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [47.08, 47.35, -1.83, -1.37]
territory = [[47.08, 47.35, -1.83, -1.37]]
municipal_sources = ["NANTES_OPENDATA"]
dedup_note = """
Calibrated 2026-11-20: OSM mirrors the inventory (68% caught at 2 m);
6 m keeps 2.5 true per false, 8 m falls to 0.78.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
NANTES_OPENDATA = "Nantes Open Data"

[[tree_sources]]
label = "Nantes Métropole - Patrimoine arboré de Nantes Métropole et de la Ville de Nantes (Licence Ouverte)"
url = "https://data.nantesmetropole.fr/explore/dataset/244400404_patrimoine-arbore-nantes-metropole/"

[[landmark_sources]]
label = "Ministère de la Culture - Immeubles protégés au titre des Monuments Historiques (Licence Ouverte)"
url = "https://www.data.gouv.fr/datasets/immeubles-proteges-au-titre-des-monuments-historiques-2"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city FRNTE`.
"""

[jobs.osm]
schedule = "0 45 9 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 32 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
