# Providence's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPVD"
name = "Providence"
slug = "providence"
center = [-71.4128, 41.824]
ecoregion = 339
ecoregion_name = "Northeast US Coastal forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "nearctic"
bounds = [41.77, 41.87, -71.48, -71.3696]
territory = [[41.7723, 41.8619, -71.4725, -71.3696]]
municipal_sources = ["PROVIDENCE_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-21: 6m 1273/53 (4.2%), marginal 3.8; 8m 1.8.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
PROVIDENCE_OPENDATA = "Providence Open Data"

[[tree_sources]]
label = "City of Providence Parks Department, Forestry Division - Tree Inventory (TreeKeeper; no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://providenceri.treekeepersoftware.com/"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPVD`.
"""

[jobs.osm]
schedule = "0 45 10 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 58 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
