# Fort St. John's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "CAFSJ"
name = "Fort St. John"
slug = "fortstjohn"
center = [-120.8476, 56.2465]
ecoregion = 376
ecoregion_name = "Mid-Canada Boreal Plains forests"
usda_zone = 3
biome = "Boreal Forests/Taiga"
realm = "nearctic"
bounds = [56.2, 56.29, -120.97, -120.73]
territory = [[56.2, 56.29, -120.97, -120.73]]
municipal_sources = ["FORT_ST_JOHN_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): only 104 OSM trees; 4 m flags 89, 1 false;
larger cells add 1 more true.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
FORT_ST_JOHN_OPENDATA = "Fort St. John Open Data"

[[tree_sources]]
label = "City of Fort St. John - Tree Inventory (Open Government License - City of Fort St. John; contains information licensed under the Open Government License - City of Fort St. John)"
url = "https://data-fortstjohn.opendata.arcgis.com/datasets/c4ee1a5aa7c7496b8a70544a8fcf4e1a_0/about"

[[landmark_sources]]
label = "City of Fort St. John - Recreation Areas and Points of Interest (Open Government License - City of Fort St. John)"
url = "https://data-fortstjohn.opendata.arcgis.com/datasets/66b0dcbb2f9e4478b8f2751cb4742475_0/about"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAFSJ`.
"""

[jobs.osm]
schedule = "0 15 12 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 40 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
