# Grand Junction's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USGJT"
name = "Grand Junction"
slug = "grandjunction"
center = [-108.5506, 39.0639]
ecoregion = 429
ecoregion_name = "Colorado Plateau shrublands"
usda_zone = 7
biome = "Deserts & Xeric Shrublands"
realm = "nearctic"
bounds = [39.01, 39.16, -108.7, -108.45]
territory = [[39.0194, 39.1534, -108.6759, -108.4595]]
municipal_sources = ["GRAND_JUNCTION_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-23): 6 m flags 1,594, 41 false (2.6%), recall 84%;
8 m adds 103 true for 35 false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
GRAND_JUNCTION_OPENDATA = "Grand Junction Open Data"

[[tree_sources]]
label = "City of Grand Junction GIS and Parks Forestry - Trees (CC0 1.0)"
url = "https://www.arcgis.com/home/item.html?id=cef93c83233749eb9265914aca06b35c"

[[landmark_sources]]
label = "City of Grand Junction - Historic Sites (CC0 1.0)"
url = "https://www.arcgis.com/home/item.html?id=474f2237f2c44e6bbe5b6588d7638a43"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USGJT`.
"""

[jobs.osm]
schedule = "0 45 12 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 5 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
