# Louisville, CO's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USLSV"
name = "Louisville, CO"
slug = "louisville_co"
center = [-105.1319, 39.9778]
ecoregion = 402
ecoregion_name = "Western shortgrass prairie"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [39.9396, 39.9982, -105.1893, -105.1073]
territory = [[39.9396, 39.9982, -105.1893, -105.1073]]
municipal_sources = []
dedup_note = """
Louisville, CO: no inventory, so nothing to calibrate against.  Default.
"""
dedup_cell_metres = 10
data_freshness = "none"

[[tree_sources]]
label = "Community submissions and OpenStreetMap (no municipal inventory)"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USLSV`.
"""

[jobs.osm]
schedule = "0 15 21 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 3 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
