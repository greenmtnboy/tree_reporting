[[tree_sources]]
label = "City of Mississauga Open Data - City Owned Tree Inventory"
url = "https://data.mississauga.ca/datasets/city-owned-tree-inventory"

[[landmark_sources]]
label = "City of Mississauga Open Data - City Landmarks"
url = "https://data.mississauga.ca/datasets/city-landmarks"

[jobs.city]
schedule = "0 20 20 * * FRI,MON"
timeout_seconds = 2400
memory_mb = 3072
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city CAMIS`.
"""
timeout_seconds_note = """
271k published rows out of a 499k layer, plus a 17k OSM partition. The
read is fast (a hosted FeatureServer paging 2,000 at a time); the merge
is what wants the memory.
"""

[jobs.osm]
schedule = "0 0 4 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 22 3 * * SUN"
timeout_seconds = 900
memory_mb = 2048
