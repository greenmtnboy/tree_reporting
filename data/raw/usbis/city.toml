# Bismarck's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USBIS"
name = "Bismarck"
slug = "bismarck"
center = [-100.7837, 46.8083]
ecoregion = 396
ecoregion_name = "Northern Shortgrass prairie"
usda_zone = 4
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [46.72, 46.89, -100.85, -100.68]
territory = [[46.72, 46.89, -100.85, -100.68]]
municipal_sources = ["BISMARCK_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-23): 4 m flags 340, 0 false, recall 79%;
6 m adds 9 true for 8 false.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
BISMARCK_OPENDATA = "Bismarck Open Data"

[[tree_sources]]
label = "City of Bismarck Forestry - Tree Inventory (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=c84565e8695d41fbbde0973470cefab6"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USBIS`.
"""

[jobs.osm]
schedule = "0 30 12 * * THU"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 58 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
