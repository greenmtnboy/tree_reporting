# Hastings's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "NZHAS"
name = "Hastings"
slug = "hastings"
center = [176.84, -39.64]
ecoregion = 171
ecoregion_name = "New Zealand North Island temperate forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "australasia"
bounds = [-39.85, -39.1, 176.5, 177.05]
territory_note = """
Hastings District with Napier City cut out (no HDC tree or landmark
falls in the hole), so Napier's OSM trees are not labelled Hastings.
"""
territory = [
    [-39.85, -39.56, 176.5, 177.05],
    [-39.455, -39.1, 176.5, 177.05],
    [-39.56, -39.455, 176.5, 176.8],
    [-39.56, -39.455, 176.96, 177.05],
]
municipal_sources = ["HASTINGS_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-21: 8m 916/63 (6.9%), marginal 4.4; 10m 2.7.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
HASTINGS_OPENDATA = "Hastings Open Data"

[[tree_sources]]
label = "Hastings District Council - Hastings DC Trees (CC BY 4.0, per the council's open data portal)"
url = "https://hastings-dc-open-data-hdcgis.hub.arcgis.com/"

[[landmark_sources]]
label = "Hastings District Council - District Plan heritage features (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://storymaps.arcgis.com/stories/0d80ff4cad20442282c4622bbbce3989"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city NZHAS`.
"""

[jobs.osm]
schedule = "0 15 11 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 8 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
