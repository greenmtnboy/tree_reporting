# Sacramento's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USSAC"
name = "Sacramento"
slug = "sacramento"
center = [-121.4944, 38.5816]
ecoregion = 385
ecoregion_name = "California Central Valley grasslands"
usda_zone = 9
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [38.43, 38.7, -121.57, -121.36]
territory = [[38.4378, 38.6857, -121.5602, -121.3627]]
municipal_sources = ["SACRAMENTO_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
9,654 staged OSM nodes against 106,242 anchors.  Mutual-NN 94.3% in
2-5 m, 56.3% in 5-10 m (n=371): a 5 m guarantee caps it at 10.
Marginal table: 8->10 removes 71 duplicates for 57 hidden trees (1.25),
10->14 removes 58 for 110 (0.53), so 10 m.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
SACRAMENTO_OPENDATA = "Sacramento Open Data"

[[tree_sources]]
label = "City of Sacramento Public Works, Urban Forestry - City Maintained Trees (ArcGIS, City of Sacramento Open Data Terms of Use)"
url = "https://www.arcgis.com/home/item.html?id=b9b716e09b5048179ab648bb4518452b"

[[landmark_sources]]
label = "City of Sacramento - Register of Historic and Cultural Resources, Historic Landmarks; National Park Service - National Register of Historic Places"
url = "https://services5.arcgis.com/54falWtcpty3V47Z/arcgis/rest/services/Historic_Landmarks/FeatureServer/0"

[jobs.city]
schedule = "0 50 8 * * SAT,TUE"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USSAC`.
"""

[jobs.osm]
schedule = "0 30 6 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 20 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
