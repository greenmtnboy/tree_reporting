# Washington, DC's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USWAS"
name = "Washington, DC"
slug = "washingtondc"
center = [-77.0369, 38.9072]
osm_name = "Washington DC"
ecoregion = 399
ecoregion_name = "Southeast US conifer savannas"
usda_zone = 7
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [38.78, 39.01, -77.15, -76.88]
territory_note = """
The District's line runs along the Potomac's Virginia shore; USNVA's
staircase gives up whatever of its ground the polygon takes.
"""
territory = [[38.7916, 38.9959, -77.1198, -76.9093]]
municipal_sources = ["WASHINGTONDC_OPENDATA"]
dedup_note = """
35.1% over n=558.
"""
dedup_cell_metres = 10
data_freshness = "probe"
data_freshness_comment = "when Washington DC data is through"
osm_freshness_comment = "GCS publication time of Washington DC's staged OSM parquet"
satellite = true
predicted = true

[labels]
WASHINGTONDC_OPENDATA = "Open Data DC"

[[tree_sources]]
label = "Open Data DC (Urban Forestry Street Trees)"
url = "https://opendata.dc.gov/datasets/DCGIS::urban-forestry-street-trees"

[[landmark_sources]]
label = "No landmark dataset in production yet (empty placeholder parquet)"

[jobs.city]
schedule = "0 40 11 * * *"
timeout_seconds = 1800
memory_mb = 2048

[jobs.osm]
schedule = "0 30 2 * * FRI"
timeout_seconds = 1800
memory_mb = 1024

[jobs.landmarks]
schedule = "0 20 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
