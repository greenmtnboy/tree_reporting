# Houston's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USHOU"
name = "Houston"
slug = "houston"
center = [-95.3698, 29.7604]
ecoregion = 384
ecoregion_name = "Western Gulf coastal grasslands"
usda_zone = 9
biome = "Tropical & Subtropical Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [29.45, 30.156, -95.9098, -95.0]
territory = [[29.5162, 30.156, -95.9098, -95.0126]]
municipal_sources = ["HOUSTON_OPENDATA"]
dedup_note = """
Calibrated 2026-11-12 on the first build (tools/osm_dedup_validation.py).
24,731 staged OSM nodes against 215,139 anchors.  Mutual-NN 61.6% in
5-10 m, 28.8% in 10-20 m (n=594): a 10 m guarantee caps it at 20.
Marginal table: 8->10 removes 68 duplicates for 36 hidden trees (1.89),
10->14 removes 62 for 98 (0.63), so 10 m.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
HOUSTON_OPENDATA = "Houston Open Data"

[[tree_sources]]
label = "City of Houston Parks & Recreation, Urban Forestry - street-tree inventory (ArcGIS)"
url = "https://geohwp.houstontx.gov/arcgis/rest/services/03_BaseData_External/Land_Base/FeatureServer/0"

[[landmark_sources]]
label = "City of Houston - Historic Sites and Landmarks (Landmarks and Protected Landmarks)"
url = "https://services.arcgis.com/NummVBqZSIJKUeVR/arcgis/rest/services/COH_Historic_Sites_and_Landmarks_view/FeatureServer/6"

[jobs.city]
schedule = "0 20 7 * * THU,SUN"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USHOU`.
"""

[jobs.osm]
schedule = "0 0 5 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 30 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
