# Orland Park's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USOPK"
name = "Orland Park"
slug = "orlandpark"
center = [-87.8539, 41.6303]
ecoregion = 387
ecoregion_name = "Central US forest-grasslands transition"
usda_zone = 6
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [41.54, 41.67, -87.93, -87.77]
territory = [[41.5521, 41.6526, -87.9117, -87.7897]]
municipal_sources = ["ORLAND_PARK_OPENDATA"]
dedup_note = """
Calibrated 2026-11-24 (osm_dedup_validation): 8m flags 207, 2.9% false;
marginal 3.3 true per false at 8m, 0.4 at 10m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
ORLAND_PARK_OPENDATA = "Orland Park Open Data"

[[tree_sources]]
label = "Village of Orland Park - Public Trees (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=780d9c0a3883498b82e046ef231144c9"

[[landmark_sources]]
label = "Village of Orland Park - Old Orland Historic District contributing structures (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=99feff2aaed940efab4e39b8898e128a"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USOPK`.
"""

[jobs.osm]
schedule = "0 0 12 * * FRI"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 27 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
