# Latrobe City's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "AULTV"
name = "Latrobe City"
slug = "latrobe"
center = [146.405, -38.235]
ecoregion = 176
ecoregion_name = "Southeast Australia temperate forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "australasia"
bounds = [-38.5, -38.0, 146.15, 146.75]
territory = [[-38.5, -38.0, 146.15, 146.75]]
municipal_sources = ["LATROBE_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-22): 8 m flags 3,552, 0.9% false, 96.3% recall;
10 m adds 81 for 24 more false.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
LATROBE_OPENDATA = "Latrobe City Open Data"

[[tree_sources]]
label = "Latrobe City Council - Tree Inventory (CC BY 4.0)"
url = "https://latrobecc.maps.arcgis.com/home/item.html?id=f41d6a33a5a545e9b84aca02d8448377"

[[landmark_sources]]
label = "Department of Transport and Planning - Victorian Heritage Register via Vicmap (CC BY 4.0)"
url = "https://discover.data.vic.gov.au/dataset/victorian-heritage-register"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city AULTV`.
"""

[jobs.osm]
schedule = "0 45 11 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 28 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
