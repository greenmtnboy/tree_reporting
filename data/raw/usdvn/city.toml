# Davenport's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USDVN"
name = "Davenport"
slug = "davenport"
center = [-90.5776, 41.5236]
ecoregion = 388
ecoregion_name = "Central Tallgrass prairie"
usda_zone = 5
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [41.45, 41.63, -90.7, -90.49]
territory = [[41.4606, 41.6243, -90.688, -90.4907]]
municipal_sources = ["DAVENPORT_OPENDATA"]
dedup_note = """
Calibrated 2026-11-23 (osm_dedup_validation): only 24 OSM trees sit on
inventory trees; 4m flags 4, 0 false; 6m adds a false one.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
DAVENPORT_OPENDATA = "Davenport Open Data"

[[tree_sources]]
label = "City of Davenport GIS - Trees (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=1e73252e386144799b39e95dbaa684ef"

[[landmark_sources]]
label = "City of Davenport Planning and Zoning - Local Historic Landmarks (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://gis.davenportiowa.com/arcgis/rest/services/Hosted/Individually_Listed_LHL/FeatureServer/3"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USDVN`.
"""

[jobs.osm]
schedule = "0 0 12 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 21 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
