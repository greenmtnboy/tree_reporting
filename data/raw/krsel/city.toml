# Seoul's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "KRSEL"
name = "Seoul"
slug = "seoul"
center = [126.978, 37.5665]
ecoregion = 655
ecoregion_name = "Central Korean deciduous forests"
usda_zone = 7
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [37.42, 37.71, 126.76, 127.19]
territory = [[37.42, 37.71, 126.76, 127.19]]
municipal_sources = ["SEOUL_OPENDATA"]
dedup_note = """
osm_dedup_validation 2026-11-23: dense street rows; 4 m flags 594,
123 false (20.7%); 6 m adds 180 true for 163 false.
"""
dedup_cell_metres = 4
data_freshness = "probe"

[labels]
SEOUL_OPENDATA = "Seoul Open Data"

[[tree_sources]]
label = "Seoul Metropolitan Government - Seoul Street Tree Locations, Seoul Open Data Plaza OA-23040 (no restriction on use)"
url = "https://data.seoul.go.kr/dataList/OA-23040/F/1/datasetView.do"

[[landmark_sources]]
label = "Seoul Metropolitan Government - Protected and Veteran Trees, Seoul Open Data Plaza OA-1323 (no restriction on use)"
url = "https://data.seoul.go.kr/dataList/OA-1323/S/1/datasetView.do"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city KRSEL`.
"""

[jobs.osm]
schedule = "0 45 12 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 9 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
