# Pinellas County's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPIE"
name = "Pinellas County"
slug = "pinellas"
center = [-82.72, 27.89]
ecoregion = 399
ecoregion_name = "Southeast US conifer savannas"
usda_zone = 10
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [27.6, 28.18, -82.86, -82.58]
territory = [[27.6, 28.18, -82.86, -82.58]]
municipal_sources = ["PINELLAS_COUNTY_OPENDATA"]
dedup_note = """
Calibrated 2026-11-28 (osm_dedup_validation): 6m flags 180, 1.1% false;
8m adds 9 true for 9 false (5.6% false).
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
PINELLAS_COUNTY_OPENDATA = "Pinellas County Open Data"

[[tree_sources]]
label = "Pinellas County Public Works - Tree Inventory (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=4d5bed2b3a3c4985aa4ffb2c7670fd8b"

[[landmark_sources]]
label = "Pinellas County - Historic Landmarks, unincorporated county (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=a050d3efccf2453091db507bb71be718"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPIE`.
"""

[jobs.osm]
schedule = "0 0 15 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 39 1 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
