# Bassendean's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "AUBSD"
name = "Bassendean"
slug = "bassendean"
center = [115.9466, -31.9097]
ecoregion = 206
ecoregion_name = "Southwest Australia woodlands"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "australasia"
bounds = [-31.94, -31.88, 115.92, 115.98]
territory = [[-31.94, -31.88, 115.92, 115.98]]
municipal_sources = ["BASSENDEAN_OPENDATA"]
