# Wellington's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "NZWLG"
name = "Wellington"
slug = "wellington"
center = [174.7762, -41.2865]
ecoregion = 171
ecoregion_name = "New Zealand North Island temperate forests"
usda_zone = 10
biome = "Temperate Broadleaf & Mixed Forests"
realm = "australasia"
bounds = [-41.37, -41.13, 174.6, 174.9]
territory = [[-41.37, -41.13, 174.6, 174.9]]
municipal_sources = ["WELLINGTON_OPENDATA"]
dedup_note = """
Calibrated 2026-11-17 (osm_dedup_validation.py, local inventory parquet)
against the staged extract. Mutual-NN 90.3% in 2-5 m, 45.5% in 5-10 m
(n=143): a 5 m guarantee caps it at 10. Marginal table: 6->8 removes 42
duplicates for 27 hidden trees (1.56), 8->10 removes 26 for 32 (0.81),
so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
WELLINGTON_OPENDATA = "Wellington Open Data"

[[tree_sources]]
label = "Wellington City Council - WCC Trees (CC BY 4.0)"
url = "https://data-wcc.opendata.arcgis.com/datasets/93ca9097fd4b487e9fcf55ad75941136_53"

[[landmark_sources]]
label = "Wellington City Council - 2024 District Plan heritage schedules SCHED1-3 (CC BY 4.0)"
url = "https://data-wcc.opendata.arcgis.com/datasets/WCC::heritage-buildings-sched1-2024-district-plan/about"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city NZWLG`.
"""

[jobs.osm]
schedule = "0 15 8 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 58 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
