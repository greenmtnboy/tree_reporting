# Chula Vista's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USCHV"
name = "Chula Vista"
slug = "chula_vista"
center = [-117.0842, 32.6401]
ecoregion = 422
ecoregion_name = "California coastal sage and chaparral"
usda_zone = 10
biome = "Mediterranean Forests, Woodlands & Scrub"
realm = "nearctic"
bounds = [32.578, 32.6857, -117.1239, -116.9277]
territory = [[32.578, 32.6857, -117.1239, -116.9277]]
municipal_sources = []
dedup_note = """
Chula Vista: no inventory, so nothing to calibrate against.  Default.
"""
dedup_cell_metres = 10
data_freshness = "none"

[[tree_sources]]
label = "Community submissions and OpenStreetMap (no municipal inventory)"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USCHV`.
"""

[jobs.osm]
schedule = "0 45 21 * * SUN"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 7 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
