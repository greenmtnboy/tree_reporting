# Ballarat's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "AUBAL"
name = "Ballarat"
slug = "ballarat"
center = [143.8503, -37.5622]
ecoregion = 176
ecoregion_name = "Southeast Australia temperate forests"
usda_zone = 9
biome = "Temperate Broadleaf & Mixed Forests"
realm = "australasia"
bounds = [-37.8, -37.3, 143.55, 144.1]
territory = [[-37.8, -37.3, 143.55, 144.1]]
municipal_sources = ["BALLARAT_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
6,367 staged OSM nodes against 84,119 anchors.  Mutual-NN 60.9% in
5-10 m, 18.6% in 10-20 m (n=483): a 10 m guarantee caps it at 20.
Marginal table: 8->10 removes 149 duplicates for 95 hidden trees (1.57),
10->14 removes 94 for 202 (0.47), so 10 m.
"""
dedup_cell_metres = 10
data_freshness = "probe"

[labels]
BALLARAT_OPENDATA = "Ballarat Open Data"

[[tree_sources]]
label = "City of Ballarat Open Data - Trees (CC BY 3.0 AU)"
url = "https://data.ballarat.vic.gov.au/explore/dataset/trees/"

[[tree_sources]]
label = "City of Ballarat Open Data - Exceptional Tree Register (CC BY 3.0 AU)"
url = "https://data.ballarat.vic.gov.au/explore/dataset/exceptional-tree-register/"

[[landmark_sources]]
label = "Victorian Heritage Register (Vicmap, Department of Transport and Planning, CC BY 4.0)"
url = "https://discover.data.vic.gov.au/dataset/victorian-heritage-register"

[jobs.city]
schedule = "0 50 16 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city AUBAL`.
"""

[jobs.osm]
schedule = "0 30 5 * * SAT"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 52 4 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
