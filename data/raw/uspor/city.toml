# Portland's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USPOR"
name = "Portland"
slug = "portland"
center = [-122.6784, 45.5152]
ecoregion = 403
ecoregion_name = "Willamette Valley oak savanna"
usda_zone = 8
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [45.42, 45.66, -122.84, -122.47]
territory = [[45.4325, 45.6529, -122.8368, -122.472]]
municipal_sources = ["PORTLAND_OPENDATA"]
dedup_note = """
Calibrated 2026-11-16 before the first build (tools/osm_dedup_validation.py
--inventory-parquet on a local ingest run).
30,058 staged OSM nodes against 277,939 anchors.  Mutual-NN 94.5% in
2-5 m, 43.8% in 5-10 m (n=1,010): a 5 m guarantee caps it at 10.
Marginal table: 6->8 removes 316 duplicates for 168 hidden trees (1.88),
8->10 removes 126 for 190 (0.66), so 8 m.
"""
dedup_cell_metres = 8
data_freshness = "probe"

[labels]
PORTLAND_OPENDATA = "Portland Open Data"

[[tree_sources]]
label = "City of Portland, Portland Parks & Recreation Urban Forestry - Street Tree Inventory (Active Records) and Parks Tree Inventory (ArcGIS)"
url = "https://www.arcgis.com/home/item.html?id=c2b02440053f459db71e1109b9947e51"

[[landmark_sources]]
label = "City of Portland Bureau of Planning and Sustainability - Historic and Conservation Landmarks; National Park Service - National Register of Historic Places"
url = "https://www.portlandmaps.com/od/rest/services/COP_OpenData_ZoningCode/MapServer/131"

[jobs.city]
schedule = "0 50 21 * * TUE,FRI"
timeout_seconds = 3600
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USPOR`.
"""
timeout_seconds_note = """
The street layer pages 200 rows at a time (about 1,260 requests, ~25 min).
"""

[jobs.osm]
schedule = "0 30 6 * * MON"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 12 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
