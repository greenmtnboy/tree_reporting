# Utrecht's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "NLUTC"
name = "Utrecht"
slug = "utrecht"
center = [5.1214, 52.0907]
ecoregion = 664
ecoregion_name = "European Atlantic mixed forests"
usda_zone = 8
biome = "Temperate Broadleaf & Mixed Forests"
realm = "palearctic"
bounds = [52.02, 52.15, 4.96, 5.2]
territory = [[52.02, 52.15, 4.96, 5.2]]
municipal_sources = ["UTRECHT_OPENDATA"]
dedup_note = """
Calibrated 2026-11-17 (osm_dedup_validation.py, local inventory parquet)
against the staged extract. Mutual-NN 84.8% in 2-5 m, 22.0% in 5-10 m
(n=946): a 5 m guarantee caps it at 10. Marginal table: 4->6 removes 463
duplicates for 209 hidden trees (2.22), 6->8 removes 157 for 279 (0.56),
so 6 m.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
UTRECHT_OPENDATA = "Utrecht Open Data"

[[tree_sources]]
label = "Gemeente Utrecht - Bomenkaart 2026 (CC BY 4.0)"
url = "https://open.utrecht.nl/dataset/bomenkaart-2026/ea248c2e-7ae4-47b3-bd57-f34b2d876667"

[[landmark_sources]]
label = "Gemeente Utrecht - Rijksmonumenten and Gemeentelijke monumenten, named objects (CC BY-SA 4.0)"
url = "https://open.utrecht.nl/dataset/rijksmonumenten/e30f329c-a1d9-45d8-a68b-91fbdf723703"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city NLUTC`.
"""

[jobs.osm]
schedule = "0 15 8 * * TUE"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 50 2 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
