# Missoula's registry facts.  The shared registries are generated from this
# file: edit it, then run `cd data/raw && uv run tools/sync_cities.py`.
code = "USMSO"
name = "Missoula"
slug = "missoula"
center = [-113.994, 46.8721]
ecoregion = 394
ecoregion_name = "Montana Valley and Foothill grasslands"
usda_zone = 5
biome = "Temperate Grasslands, Savannas & Shrublands"
realm = "nearctic"
bounds = [46.78, 46.97, -114.15, -113.89]
territory = [[46.7915, 46.95, -114.1273, -113.9104]]
municipal_sources = ["MISSOULA_OPENDATA"]
dedup_note = """
osm_dedup_validation (2026-11-23): 6 m flags 180, 9 false (5.0%), recall 62%;
8 m adds 22 true for 8 false.
"""
dedup_cell_metres = 6
data_freshness = "probe"

[labels]
MISSOULA_OPENDATA = "Missoula Open Data"

[[tree_sources]]
label = "City of Missoula - Tree Locations (no licence stated; displayed with attribution only, not licensed for reuse)"
url = "https://www.arcgis.com/home/item.html?id=478d76729bfc4236ae12bafb644fb635"

[[landmark_sources]]
label = "National Park Service - National Register of Historic Places"
url = "https://www.nps.gov/subjects/nationalregister/data-downloads.htm"

[jobs.city]
schedule = "0 0 12 * * SUN,WED"
timeout_seconds = 1800
memory_mb = 2048
schedule_note = """
Starts in the twice-weekly tier, placed the day after this city's OSM
extract. Measure before moving it: `portal_cadence.py --record --city USMSO`.
"""

[jobs.osm]
schedule = "0 30 12 * * WED"
timeout_seconds = 1800
memory_mb = 1024
schedule_note = """
Overpass allows two slots per client IP and answers an over-budget request
with HTTP 200 carrying an error remark, so a collision looks like a city with
no trees in OSM. This minute must be used by no other extract job.
"""

[jobs.landmarks]
schedule = "0 56 0 * * SUN"
timeout_seconds = 900
memory_mb = 2048
schedule_note = """
The next free two-minute Sunday slot; every one must land before the 05:00
union (tests/test_cloud_jobs.py).
"""
