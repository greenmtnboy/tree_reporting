name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# One live run per pull request; a new push cancels the one it superseded.
#
# This is not just tidiness here, because two of the jobs below -- `test` and
# `dashboard-queries` -- compile against trilogy-service.fly.dev, one shared
# instance that can be overloaded. They are already part of each other's load
# within one run (see the note in src/src/tests/resolverFetch.ts); without this,
# a branch pushed four times in quick succession puts four runs and eight
# resolver-backed jobs on it at once, and requests start coming back HTTP 504
# after Fly's 120s proxy timeout. The retry policy cannot dig out of that --
# four attempts at 120s apiece is eight minutes of waiting on something that is
# still overloaded -- so `test` died on its 10-minute budget having proved
# nothing. That is exactly how this branch went red, twice; with one live run
# the same job passed in 2m39s.
#
# Pushes to main are deliberately not cancelled: a superseded PR run has a
# successor coming, and main's does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-curation:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - name: Test private curation guard
      run: python3 -m unittest discover -s scripts/tests -p test_private_curation.py
    - name: Check public index and annotation history
      run: python3 scripts/check_private_curation.py

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Lint
      working-directory: ./src
      run: pnpm lint

    - name: Verify generated artwork
      working-directory: ./src
      run: pnpm artwork:check

  # The ingest models and the job table these deploy from have no other gate.
  # `data/raw/tests` asserts things whose failure mode is silence rather than an
  # error: a data_source value with no partition emits zero rows, a city with no
  # [[cloud.job]] simply stops updating. Offline and ~7s, so it runs on every PR.
  data-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        # The data scripts target 3.13 (AGENTS.md); the runner's own Python is older.
        python-version: "3.13"

    - name: Run data model tests
      working-directory: ./data/raw
      # --no-project: these are uv inline scripts and loose modules, not a
      # packaged project, so uv has nothing to install from. The dependency
      # list mirrors the `# /// script` blocks the tests import through.
      run: >
        uv run --no-project
        --with pytest --with pyarrow --with "pytrilogy>=0.3.541" --with "duckdb<2" --with requests
        python -m pytest tests -q

  rendering-tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.13"
    - name: Run offline poster data and geography tests
      run: >
        uv run --no-project --with duckdb --with matplotlib --with numpy
        --with requests --with scipy --with "shapely>=2.1"
        --with pytest --with pyarrow --with rasterio --with pyproj --with statsmodels --with pillow
        python -m pytest scripts/tests -q

  # Exercise the training/reviewer code with synthetic fixtures on CPU. Install
  # CPU wheels explicitly so this gate never downloads the Lambda CUDA stack.
  imagery-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
    - name: Install CPU test dependencies
      working-directory: ./imagery_model
      run: |
        uv venv --python 3.13
        uv pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
        uv pip install -e . pytest pillow rasterio pyproj==3.7.2 google-cloud-storage==3.17.1 shapely requests
    # The curation server's review-state encoder and chip ranking are a Rust
    # extension (native/review_native) the review modules import unconditionally;
    # the runner image ships cargo.
    - name: Build the native review extension
      working-directory: ./imagery_model
      run: .venv/bin/python native/build_review_native.py
    - name: Run all imagery and reviewer tests
      working-directory: ./imagery_model
      env:
        OMP_NUM_THREADS: '2'
        MKL_NUM_THREADS: '2'
      run: .venv/bin/python -m pytest tests -q -o addopts='' --junitxml=test-results/imagery.xml
    - name: Upload imagery test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: imagery-test-results
        path: imagery_model/test-results/
        retention-days: 14

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Build app
      working-directory: ./src
      run: pnpm build

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Run unit and integration tests
      working-directory: ./src
      run: pnpm test

  # The tile worker on DuckDB-WASM under Node, the engine the browser runs:
  # its planner differs from native DuckDB's (a WHERE on an expensive
  # expression is pushed into the scan, #144), so the default suite cannot
  # see those regressions. It installs no extension: a tile query that
  # reached for spatial again fails here. About 20 s.
  wasm-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Run the DuckDB-WASM worker tests
      working-directory: ./src
      run: pnpm test:wasm

  # The reviewer is the only path that publishes a submission, a tree report
  # or a visitor photo, and it runs on a workstation, so nothing else would
  # notice its checks regressing. Offline, seconds.
  reviewer-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Install dependencies
      working-directory: ./reviewer
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      working-directory: ./reviewer
      run: pnpm typecheck

    - name: Run reviewer tests
      working-directory: ./reviewer
      run: pnpm test

  # firestore.rules and storage.rules against the Firebase emulators. The rules
  # are what stand between an anonymous account and the public check-in count,
  # the reviewer's queues and other users' private photos, and they reach
  # production by `terraform apply` with no other check on the way. The
  # emulators need Java 21.
  firestore-rules:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 21

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache emulator downloads
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-${{ hashFiles('terraform/bootstrap/rules/tests/pnpm-lock.yaml') }}

    - name: Install dependencies
      working-directory: ./terraform/bootstrap/rules/tests
      run: pnpm install --frozen-lockfile

    - name: Run rules tests against the emulators
      working-directory: ./terraform/bootstrap/rules/tests
      run: pnpm test

  e2e:
    # Covers setup, browser install (~2 min) and Playwright's 20 min globalTimeout.
    timeout-minutes: 26
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./src
      run: pnpm exec playwright install --with-deps chromium

    # The build is Playwright's webServer command (src/playwright.config.ts):
    # `pnpm build:e2e`, which loads src/.env.e2e for the placeholder Firebase
    # config and the fixture seam the badge specs drive.
    - name: Run Playwright tests
      working-directory: ./src
      run: pnpm test:e2e

    - name: Verify unified tree sprite rendering
      working-directory: ./src
      run: pnpm test:crowns

    - name: Upload Playwright report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          src/playwright-report/
          src/test-results/
        retention-days: 14

  # Compiles every summary and species dashboard query against the hosted
  # Trilogy resolver and runs the SQL it returns against seeded fixtures. The
  # queries are string constants and TypeScript has no opinion about them, so a
  # query that fails to plan reaches production as a "trilogy generation error"
  # in the UI with nothing else in the way.
  #
  # It is a separate job from `test` only because it needs the network: the
  # whole 820-query catalog compiles in about 70 seconds. It used to take three
  # and a half minutes and was believed to take tens, because each query was a
  # separate /generate_query call and each of those re-parsed all 43 preql
  # sources. The suite now batches through /generate_queries, which hydrates the
  # model once per request — 820 queries in 21 requests. See
  # src/src/tests/dashboard-queries.test.ts.
  #
  # This runs alongside `test`, which has resolver-backed suites of its own, so
  # the two are part of each other's load. That is survivable rather than
  # serialised: every resolver call in both goes through
  # src/src/tests/resolverFetch.ts, which retries a 5xx with backoff, and their
  # timeouts have the headroom that needs. The first CI run without that had
  # `test` fail on an HTTP 502 and two 30s timeouts while this job passed.
  dashboard-queries:
    # The sweep is a fixed set of cities (see REPRESENTATIVE_CITIES and
    # LARGEST_CITIES in dashboard-queries.test.ts) on every event, pull request
    # and push to main alike: about a dozen requests, ~8 minutes. It no longer
    # widens to every city a diff touches, or to every city on main -- at 112
    # cities that was ~30s a city and overran the hour on every push. Whether
    # each city's parquet is published with the columns the app reads is the
    # per-city check, and it lives in parquetSchema.test.ts (the `test` job).
    #
    # This has to outlast COMPILE_TIMEOUT_MS in dashboard-queries.test.ts
    # (20 minutes), or the job is killed before the suite can report which
    # batch it was on.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    # The core catalog against the all-cities view and a fixed set of cities:
    # the ones whose model is structurally its own case and the largest
    # inventories. Every other city's model is new_city.py's template, so its
    # plan is the same plan with a different constant; a wider sweep by hand
    # is `DASHBOARD_QUERY_CITIES=all pnpm test:queries`.
    - name: Compile and run the core dashboard queries
      working-directory: ./src
      run: pnpm test:queries
