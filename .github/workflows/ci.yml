name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Lint
      working-directory: ./src
      run: pnpm lint

  # The ingest models and the job table these deploy from have no other gate.
  # `data/raw/tests` asserts things whose failure mode is silence rather than an
  # error: a data_source value with no partition emits zero rows, a city with no
  # [[cloud.job]] simply stops updating. Offline and ~7s, so it runs on every PR.
  data-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Run data model tests
      working-directory: ./data/raw
      # --no-project: these are uv inline scripts and loose modules, not a
      # packaged project, so uv has nothing to install from. The dependency
      # list mirrors the `# /// script` blocks the tests import through.
      run: >
        uv run --no-project
        --with pytest --with pyarrow --with pytrilogy --with duckdb --with requests
        python -m pytest tests -q

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Build app
      working-directory: ./src
      run: pnpm build

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Run unit and integration tests
      working-directory: ./src
      run: pnpm test

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./src
      run: pnpm exec playwright install --with-deps chromium

    # The build is Playwright's webServer command (src/playwright.config.ts):
    # `pnpm build:e2e`, which loads src/.env.e2e for the placeholder Firebase
    # config and the fixture seam the achievement specs drive.
    - name: Run Playwright tests
      working-directory: ./src
      run: pnpm test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: src/playwright-report/
        retention-days: 14

  # Compiles every summary and species dashboard query against the hosted
  # Trilogy resolver and runs the SQL it returns against seeded fixtures. The
  # queries are string constants and TypeScript has no opinion about them, so a
  # query that fails to plan reaches production as a "trilogy generation error"
  # in the UI with nothing else in the way.
  #
  # It is a separate job from `test` only because it needs the network: the
  # whole 820-query catalog compiles in about 70 seconds. It used to take three
  # and a half minutes and was believed to take tens, because each query was a
  # separate /generate_query call and each of those re-parsed all 43 preql
  # sources. The suite now batches through /generate_queries, which hydrates the
  # model once per request — 820 queries in 21 requests. See
  # src/src/tests/dashboard-queries.test.ts.
  #
  # `needs: test` is not about ordering, it is about not sharing the resolver.
  # `test` carries its own resolver-backed suites (trilogy-smoketest,
  # dashboard-pushdown) on a 30s timeout, and the first run of this job as a
  # sibling had the two firing at once: the sweep's four clients plus test's own
  # were enough to trip the throttle, and `test` failed with an HTTP 502 and two
  # timeouts while this job passed. Serialising the only two jobs that touch
  # trilogy-service costs nothing on the critical path -- e2e is 7m and runs in
  # parallel with both.
  dashboard-queries:
    needs: test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Compile and run every dashboard query
      working-directory: ./src
      run: pnpm test:queries
