name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# One live run per pull request; a new push cancels the one it superseded.
#
# This is not just tidiness here, because two of the jobs below -- `test` and
# `dashboard-queries` -- compile against trilogy-service.fly.dev, one shared
# instance that can be overloaded. They are already part of each other's load
# within one run (see the note in src/src/tests/resolverFetch.ts); without this,
# a branch pushed four times in quick succession puts four runs and eight
# resolver-backed jobs on it at once, and requests start coming back HTTP 504
# after Fly's 120s proxy timeout. The retry policy cannot dig out of that --
# four attempts at 120s apiece is eight minutes of waiting on something that is
# still overloaded -- so `test` died on its 10-minute budget having proved
# nothing. That is exactly how this branch went red, twice; with one live run
# the same job passed in 2m39s.
#
# Pushes to main are deliberately not cancelled: a superseded PR run has a
# successor coming, and main's does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Lint
      working-directory: ./src
      run: pnpm lint

  # The ingest models and the job table these deploy from have no other gate.
  # `data/raw/tests` asserts things whose failure mode is silence rather than an
  # error: a data_source value with no partition emits zero rows, a city with no
  # [[cloud.job]] simply stops updating. Offline and ~7s, so it runs on every PR.
  data-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Run data model tests
      working-directory: ./data/raw
      # --no-project: these are uv inline scripts and loose modules, not a
      # packaged project, so uv has nothing to install from. The dependency
      # list mirrors the `# /// script` blocks the tests import through.
      run: >
        uv run --no-project
        --with pytest --with pyarrow --with pytrilogy --with duckdb --with requests
        python -m pytest tests -q

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Build app
      working-directory: ./src
      run: pnpm build

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Run unit and integration tests
      working-directory: ./src
      run: pnpm test

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./src
      run: pnpm exec playwright install --with-deps chromium

    # The build is Playwright's webServer command (src/playwright.config.ts):
    # `pnpm build:e2e`, which loads src/.env.e2e for the placeholder Firebase
    # config and the fixture seam the achievement specs drive.
    - name: Run Playwright tests
      working-directory: ./src
      run: pnpm test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: src/playwright-report/
        retention-days: 14

  # Compiles every summary and species dashboard query against the hosted
  # Trilogy resolver and runs the SQL it returns against seeded fixtures. The
  # queries are string constants and TypeScript has no opinion about them, so a
  # query that fails to plan reaches production as a "trilogy generation error"
  # in the UI with nothing else in the way.
  #
  # It is a separate job from `test` only because it needs the network: the
  # whole 820-query catalog compiles in about 70 seconds. It used to take three
  # and a half minutes and was believed to take tens, because each query was a
  # separate /generate_query call and each of those re-parsed all 43 preql
  # sources. The suite now batches through /generate_queries, which hydrates the
  # model once per request — 820 queries in 21 requests. See
  # src/src/tests/dashboard-queries.test.ts.
  #
  # This runs alongside `test`, which has resolver-backed suites of its own, so
  # the two are part of each other's load. That is survivable rather than
  # serialised: every resolver call in both goes through
  # src/src/tests/resolverFetch.ts, which retries a 5xx with backoff, and their
  # timeouts have the headroom that needs. The first CI run without that had
  # `test` fail on an HTTP 502 and two 30s timeouts while this job passed.
  dashboard-queries:
    # 30 minutes, because a *wide* sweep is one request per city and this job
    # widens itself whenever a city model changes (see "Decide how wide to
    # sweep"). The narrow default finishes in a couple of minutes; the wide run
    # at 21 cities needs room the old 20 did not leave.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        # Two commits, so the widening step below can diff against the base.
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 10.33.0

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      working-directory: ./src
      run: pnpm install --frozen-lockfile

    # The default sweep compiles the all-cities view plus the handful of cities
    # whose model is structurally its own case (see REPRESENTATIVE_CITIES in
    # dashboard-queries.test.ts). That is the right default because every city
    # sends the same queries and each one costs a whole request, but it means a
    # city outside the set could break its own model and go green.
    #
    # So widen it exactly where that risk is real: a diff that touches any city
    # tree model, landmark model, or the city config is a change to the thing
    # this suite is checking, and gets all of them. So does every push to main,
    # which backstops anything a narrow PR run let through.
    # Name the cities this diff could have broken and let the suite add them to
    # its default set. A city's model is what decides its plan, so a pull
    # request that edits three of them sweeps those three plus the
    # representatives -- not all twenty-one, which is a whole request each.
    #
    # `all` only for a push to main, which is the backstop for anything a narrow
    # pull-request run let through. A change to cityConfig.json deliberately
    # does *not* escalate: adding a city adds its model files to the same diff,
    # so the grep below already names it, and escalating would put every
    # city-addition PR back on the full sweep this exists to avoid.
    #
    # This sets DASHBOARD_QUERY_CITIES and deliberately not
    # DASHBOARD_QUERY_ALL_CITIES: the latter also widens the interactive states
    # and takes the run from 25 batches to 60.
    - name: Decide which cities to sweep
      id: sweep
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "cities=all" >> "$GITHUB_OUTPUT"
          echo "reason=push to ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
        codes=$(echo "$changed" \
          | grep -oE '^data/raw/[a-z]{5}/[a-z_]+_(tree_info|landmarks)\.preql$' \
          | cut -d/ -f3 | tr '[:lower:]' '[:upper:]' | sort -u | paste -sd, -)
        echo "cities=$codes" >> "$GITHUB_OUTPUT"
        if [ -n "$codes" ]; then
          echo "reason=city models changed: $codes" >> "$GITHUB_OUTPUT"
        else
          echo "reason=no city model changed" >> "$GITHUB_OUTPUT"
        fi

    - name: Compile and run every dashboard query
      working-directory: ./src
      env:
        DASHBOARD_QUERY_CITIES: ${{ steps.sweep.outputs.cities }}
      run: |
        echo "sweeping representatives + [${{ steps.sweep.outputs.cities }}] -- ${{ steps.sweep.outputs.reason }}"
        pnpm test:queries
