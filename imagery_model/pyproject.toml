[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urban-tree-ml"
version = "0.1.0"
description = "Raw overhead imagery to urban tree location, DBH, and taxonomy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.5.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=19",
  "pydantic>=2.10",
  "pyproj>=3.7",
  "pyyaml>=6.0",
  "typer>=0.15",
]

[project.scripts]
urban-tree-ml = "urban_tree_ml.cli:app"

[dependency-groups]
imagery = [
  "pillow>=11",
  "planetary-computer>=1.0",
  "pystac-client>=0.9",
  "rasterio>=1.4",
]
train = [
  "lightning>=2.5",
  "tensorboard>=2.18",
  "torch>=2.6",
  "torchmetrics>=1.6",
  "torchvision>=0.21",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urban_tree_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
